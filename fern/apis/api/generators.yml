# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json
default-group: local
groups:
  local:
    generators:
      - name: fernapi/fern-typescript-node-sdk
        version: 3.60.0
        output:
          location: local-file-system
          path: ../../generated/typescript
        config:
          namespaceExport: AgentMail
          noSerdeLayer: false
          skipResponseValidation: true
          shouldGenerateWebsocketClients: true
        smart-casing: false
      - name: fernapi/fern-python-sdk
        version: 4.64.1
        output:
          location: local-file-system
          path: ../../generated/python
        config:
          client_class_name: AgentMail
          pydantic_config:
            skip_validation: true
          should_generate_websocket_clients: true
        smart-casing: false
  node-sdk:
    generators:
      - name: fernapi/fern-typescript-node-sdk
        version: 3.60.0
        output:
          location: npm
          package-name: agentmail
          token: OIDC
        github:
          repository: agentmail-to/agentmail-node
          license: MIT
        config:
          namespaceExport: AgentMail
          noSerdeLayer: false
          skipResponseValidation: true
          shouldGenerateWebsocketClients: true
          # The hand-written wrapper (src/wrapper/x402.ts, src/wrapper/Client.ts)
          # lazily imports @x402/fetch for the opt-in payments feature. Declare it
          # as an optional peer dependency so bundlers, file tracers, and isolated
          # installers can resolve the import (agentmail-node#24).
          extraPeerDependencies:
            "@x402/fetch": "^2"
          extraPeerDependenciesMeta:
            "@x402/fetch":
              optional: true
          packageJson:
            # Dev-toolchain security pins. These live here, not in the generated
            # repo: agentmail-node is regenerated on every SDK release, and a fix
            # applied directly there is wiped by the next one (it happened in
            # agentmail-node#27, reverted by Release 0.5.20).
            #
            # vite is declared rather than overridden because it is an
            # auto-installed peer of vitest, and pnpm does not apply overrides to
            # auto-installed peers.
            #   vite     >=8.0.16  GHSA-fx2h-pf6j-xcff, GHSA-v2wj-q39q-566r,
            #                      GHSA-p9ff-h696-f583, GHSA-v6wh-96g9-6wx3
            #   postcss  >=8.5.23  GHSA-r28c-9q8g-f849, GHSA-6g55-p6wh-862q,
            #                      GHSA-fxqj-rqcc-2cmp, GHSA-qx2v-qp2m-jg93
            #   fast-uri >=3.1.5   GHSA-q3j6-qgpj-74h6, GHSA-v39h-62p7-jpjc,
            #                      GHSA-7p8r-x3mc-p8w7, GHSA-v2hh-gcrm-f6hx,
            #                      GHSA-4c8g-83qw-93j6
            devDependencies:
              vite: ^8.0.16
            pnpm:
              overrides:
                postcss: ">=8.5.23"
                fast-uri: ">=3.1.5"
            description:
              "The email inbox API for AI agents. Send, receive, reply, and
              manage threaded email conversations programmatically."
            keywords:
              - email
              - ai
              - agent
              - inbox
              - api
              - email-api
              - ai-agent
              - llm
              - langchain
              - crewai
              - autonomous-agent
              - agentmail
            homepage: "https://agentmail.to"
            license: MIT
            author: "AgentMail <support@agentmail.cc>"
            scripts:
              build: >-
                npm run build:cjs && npm run build:esm && node -e "const
                https=require('https'),fs=require('fs');const download=(f)=>new
                Promise((res,rej)=>https.get('https://docs.agentmail.to/'+f,r=>r.pipe(fs.createWriteStream('dist/'+f)).on('finish',res).on('error',rej)));Promise.all(['llms.txt','llms-full.txt'].map(download)).catch(e=>{console.error(e);process.exit(1)});"
        smart-casing: false
  python-sdk:
    generators:
      - name: fernapi/fern-python-sdk
        version: 4.64.1
        output:
          location: pypi
          package-name: agentmail
          token: ${PYPI_TOKEN}
        github:
          repository: agentmail-to/agentmail-python
          license: MIT
        config:
          client_class_name: AgentMail
          pydantic_config:
            skip_validation: true
          should_generate_websocket_clients: true
          pyproject_toml: |
            description = "The email inbox API for AI agents. Send, receive, reply, and manage threaded email conversations programmatically."
            authors = ["AgentMail <support@agentmail.cc>"]
            keywords = ["email", "ai", "agent", "inbox", "api", "email-api", "ai-agent", "llm", "langchain", "crewai", "autonomous-agent", "agentmail"]
            license = "MIT"
            homepage = "https://agentmail.to"
        smart-casing: false
  openapi:
    generators:
      - name: fernapi/fern-openapi
        version: 0.3.0
        output:
          location: local-file-system
          path: ../../../openapi
        smart-casing: false
  postman:
    generators:
      - name: fernapi/fern-postman
        version: 0.6.1
        output:
          location: postman
          api-key: ${POSTMAN_API_KEY}
          workspace-id: 0b0ed383-d63d-4063-b758-aa02d7bf9edb
        smart-casing: false
