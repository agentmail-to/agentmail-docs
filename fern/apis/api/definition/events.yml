# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  inboxes: inboxes/__package__.yml
  threads: threads.yml
  messages: messages.yml
  domains: domains.yml
  calendar: calendar.yml

types:
  EventType:
    enum:
      - name: MESSAGE_RECEIVED
        value: message.received
      - name: MESSAGE_RECEIVED_SPAM
        value: message.received.spam
      - name: MESSAGE_RECEIVED_BLOCKED
        value: message.received.blocked
      - name: MESSAGE_RECEIVED_UNAUTHENTICATED
        value: message.received.unauthenticated
      - name: MESSAGE_SENT
        value: message.sent
      - name: MESSAGE_DELIVERED
        value: message.delivered
      - name: MESSAGE_BOUNCED
        value: message.bounced
      - name: MESSAGE_COMPLAINED
        value: message.complained
      - name: MESSAGE_REJECTED
        value: message.rejected
      - name: MESSAGE_OPENED
        value: message.opened
      - name: DOMAIN_VERIFIED
        value: domain.verified
      - name: CALENDAR_EVENT_CREATED
        value: calendar.event.created
      - name: CALENDAR_EVENT_UPDATED
        value: calendar.event.updated
      - name: CALENDAR_EVENT_DELETED
        value: calendar.event.deleted
      - name: CALENDAR_EVENT_RESPONDED
        value: calendar.event.responded
      - name: CALENDAR_EVENT_STARTING
        value: calendar.event.starting
      - name: CALENDAR_EVENT_ENDING
        value: calendar.event.ending

  EventTypes:
    type: list<EventType>
    docs: Event types for which to send events.

  MessageReceivedEventType:
    enum:
      - name: MESSAGE_RECEIVED
        value: message.received
      - name: MESSAGE_RECEIVED_SPAM
        value: message.received.spam
      - name: MESSAGE_RECEIVED_BLOCKED
        value: message.received.blocked
      - name: MESSAGE_RECEIVED_UNAUTHENTICATED
        value: message.received.unauthenticated

  PodIds:
    type: list<string>
    docs: Pods for which to send events. Maximum 10 per webhook.

  InboxIds:
    type: list<string>
    docs: Inboxes for which to send events. Maximum 10 per webhook.

  EventId:
    type: string
    docs: ID of event.

  Timestamp:
    type: datetime
    docs: Timestamp of event.

  Recipient:
    properties:
      address:
        type: string
        docs: Recipient address.
      status:
        type: string
        docs: Recipient status.

  Send:
    properties:
      inbox_id: inboxes.InboxId
      thread_id: threads.ThreadId
      message_id: messages.MessageId
      timestamp: Timestamp
      recipients:
        type: list<string>
        docs: Sent recipients.

  Delivery:
    properties:
      inbox_id: inboxes.InboxId
      thread_id: threads.ThreadId
      message_id: messages.MessageId
      timestamp: Timestamp
      recipients:
        type: list<string>
        docs: Delivered recipients.

  Bounce:
    properties:
      inbox_id: inboxes.InboxId
      thread_id: threads.ThreadId
      message_id: messages.MessageId
      timestamp: Timestamp
      type:
        type: string
        docs: Bounce type.
      sub_type:
        type: string
        docs: Bounce sub-type.
      recipients:
        type: list<Recipient>
        docs: Bounced recipients.

  Complaint:
    properties:
      inbox_id: inboxes.InboxId
      thread_id: threads.ThreadId
      message_id: messages.MessageId
      timestamp: Timestamp
      type:
        type: string
        docs: Complaint type.
      sub_type:
        type: string
        docs: Complaint sub-type.
      recipients:
        type: list<string>
        docs: Complained recipients.

  Reject:
    properties:
      inbox_id: inboxes.InboxId
      thread_id: threads.ThreadId
      message_id: messages.MessageId
      timestamp: Timestamp
      reason:
        type: string
        docs: Reject reason.

  Open:
    properties:
      inbox_id: inboxes.InboxId
      thread_id: threads.ThreadId
      message_id: messages.MessageId
      timestamp: Timestamp

  MessageReceivedEvent:
    docs: A message was received. Spam, blocked, and unauthenticated received-message events use the same payload shape with different `event_type` values.
    properties:
      type: literal<"event">
      event_type: MessageReceivedEventType
      event_id: EventId
      message: messages.Message
      thread: threads.ThreadItem

  MessageSentEvent:
    properties:
      type: literal<"event">
      event_type: literal<"message.sent">
      event_id: EventId
      send: Send

  MessageDeliveredEvent:
    properties:
      type: literal<"event">
      event_type: literal<"message.delivered">
      event_id: EventId
      delivery: Delivery

  MessageBouncedEvent:
    properties:
      type: literal<"event">
      event_type: literal<"message.bounced">
      event_id: EventId
      bounce: Bounce

  MessageComplainedEvent:
    properties:
      type: literal<"event">
      event_type: literal<"message.complained">
      event_id: EventId
      complaint: Complaint

  MessageRejectedEvent:
    properties:
      type: literal<"event">
      event_type: literal<"message.rejected">
      event_id: EventId
      reject: Reject

  MessageOpenedEvent:
    docs: |
      A tracked message was opened for the first time. Sent once per message: repeat opens do not
      resend it.
    properties:
      type: literal<"event">
      event_type: literal<"message.opened">
      event_id: EventId
      open: Open

  DomainVerifiedEvent:
    properties:
      type: literal<"event">
      event_type: literal<"domain.verified">
      event_id: EventId
      domain: domains.Domain

  CalendarEventPrevious:
    docs: |
      The values that a `calendar.event.updated` change replaced, for the fields it changed. Only
      changed fields appear; a field that had no value before the change is absent.
    properties:
      title: optional<string>
      description: optional<string>
      location: optional<string>
      metadata: optional<unknown>
      status: optional<calendar.CalendarEventStatus>
      all_day: optional<boolean>
      start: optional<calendar.WallTime>
      end: optional<calendar.WallTime>
      timezone: optional<calendar.IanaTimezone>
      duration_mode: optional<calendar.DurationMode>
      recurrence: optional<calendar.Recurrence>
      attendees: optional<list<calendar.Attendee>>

  CalendarEventCreatedEvent:
    docs: |
      An event was created, through the API or from an invitation the inbox received. Also sent when
      one date of a recurring event is edited for the first time; `calendar_event` is then that date.
    properties:
      type: literal<"event">
      event_type: literal<"calendar.event.created">
      event_id:
        type: EventId
        docs: Equals the `operation_id` returned by the request that made the change.
      inbox_id: inboxes.InboxId
      calendar_event: calendar.CalendarEvent

  CalendarEventUpdatedEvent:
    docs: |
      An event, or one or more dates of a recurring event, changed. `calendar_event` is the event
      (or the date) after the change. Cancelling dates with a delete on a dated ID also sends this
      event, with the cancelled date as `calendar_event`.
    properties:
      type: literal<"event">
      event_type: literal<"calendar.event.updated">
      event_id:
        type: EventId
        docs: Equals the `operation_id` returned by the request that made the change.
      inbox_id: inboxes.InboxId
      calendar_event: calendar.CalendarEvent
      previous:
        type: optional<CalendarEventPrevious>
        docs: For changes to a one-off or series event, the prior values of the fields that changed.

  CalendarEventDeletedEvent:
    docs: |
      A one-off or recurring event was deleted. `calendar_event` is the event as it was. Cancelling
      dates of a recurring event sends `calendar.event.updated` instead.
    properties:
      type: literal<"event">
      event_type: literal<"calendar.event.deleted">
      event_id:
        type: EventId
        docs: Equals the `deletion_id` returned by the request that made the change.
      inbox_id: inboxes.InboxId
      calendar_event: calendar.CalendarEvent

  CalendarEventRespondedEvent:
    docs: |
      An attendee's response changed: the inbox responded with the respond endpoint, or an attendee
      replied by email to an invitation the inbox sent. `calendar_event.attendees` holds the new
      statuses.
    properties:
      type: literal<"event">
      event_type: literal<"calendar.event.responded">
      event_id: EventId
      inbox_id: inboxes.InboxId
      calendar_event: calendar.CalendarEvent

  CalendarEventStartingEvent:
    docs: |
      An event, or one date of a recurring event, has started. Usually sent within a minute after
      `scheduled_at`. If a date is first picked up after it has already ended and more than 5
      minutes after its start (for example, an event created entirely in the past), neither its
      `calendar.event.starting` nor its `calendar.event.ending` is sent. Retries carry the same
      `event_id` and an identical body.
    properties:
      type: literal<"event">
      event_type: literal<"calendar.event.starting">
      event_id:
        type: EventId
        docs: Stable for this date and boundary. Use it to deduplicate deliveries.
      inbox_id: inboxes.InboxId
      calendar_event:
        type: calendar.CalendarEvent
        docs: The event or date as it stood when the boundary was first processed.
      scheduled_at:
        type: datetime
        docs: The start this webhook is for (the event's `start_at`).

  CalendarEventEndingEvent:
    docs: |
      An event, or one date of a recurring event, has ended. Usually sent within a minute after
      `scheduled_at`. Retries carry the same `event_id` and an identical body.
    properties:
      type: literal<"event">
      event_type: literal<"calendar.event.ending">
      event_id:
        type: EventId
        docs: Stable for this date and boundary. Use it to deduplicate deliveries.
      inbox_id: inboxes.InboxId
      calendar_event:
        type: calendar.CalendarEvent
        docs: The event or date as it stood when the boundary was first processed.
      scheduled_at:
        type: datetime
        docs: The end this webhook is for (the event's `end_at`).
