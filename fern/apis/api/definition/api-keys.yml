# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  global: __package__.yml

types:
  ApiKeyId:
    type: string
    docs: ID of api key.

  Prefix:
    type: string
    docs: Prefix of api key.

  Name:
    type: string
    docs: Name of api key.

  CreatedAt:
    type: datetime
    docs: Time at which api key was created.

  PublicJwkCoordinate:
    type: string
    validation:
      minLength: 43
      maxLength: 43
      pattern: "^[A-Za-z0-9_-]{43}$"
    docs: A 32-byte P-256 coordinate encoded as unpadded base64url.

  PublicJwk:
    docs: |
      A public P-256 JWK. The object accepts exactly `kty`, `crv`, `x`, and `y`.
      Private key material such as `d`, embedded key IDs, and all other members
      are rejected. The server also rejects coordinates that are not a point on
      P-256.
    properties:
      kty: literal<"EC">
      crv: literal<"P-256">
      x: PublicJwkCoordinate
      y: PublicJwkCoordinate

  OrganizationPublicKeyScope:
    docs: Organization-wide authority.
    properties: {}

  PodPublicKeyScope:
    docs: Authority over one live pod and its inboxes.
    properties:
      id:
        type: uuid
        docs: ID of the pod.

  InboxPublicKeyScope:
    docs: Authority over one live inbox incarnation.
    properties:
      id:
        type: string
        validation:
          format: email
          maxLength: 254
        docs: ID of the inbox.

  PublicKeyScope:
    docs: The immutable scope in which a public-key credential can approve AgentID sign-in.
    union:
      organization: OrganizationPublicKeyScope
      pod: PodPublicKeyScope
      inbox: InboxPublicKeyScope

  PublicKeyMaterial:
    docs: Registered public key material and its server-computed RFC 7638 thumbprint.
    properties:
      jwk: PublicJwk
      fingerprint:
        type: string
        validation:
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
        docs: RFC 7638 SHA-256 JWK thumbprint encoded as unpadded base64url.

  PublicKeyCredential:
    docs: |
      An AgentID sign-in credential. `type` and `api_key_id` are server-owned;
      use `api_key_id` as the JWS `kid`. This response never contains a bearer
      secret or private key.
    properties:
      api_key_id:
        type: uuid
        docs: Server-generated credential ID. Store this value as the signing key's `kid`.
      client_id:
        type: optional<string>
        docs: |
          Caller-chosen alias, unique within the organization. Get, Rename, and
          Revoke accept it in place of `api_key_id`.
      type:
        type: literal<"public_key">
        docs: Server-owned credential discriminator. Callers cannot select or update it.
      name:
        type: Name
        docs: Human-readable credential name.
      public_key: PublicKeyMaterial
      scope: PublicKeyScope
      organization_id: global.OrganizationId
      pod_id:
        type: optional<string>
        docs: Present for a pod- or inbox-scoped credential; the same value `scope` carries.
      inbox_id:
        type: optional<string>
        docs: Present for an inbox-scoped credential; the same value `scope` carries.
      created_by:
        type: ApiKeyCreator
        docs: The bearer API key that registered it.
      permissions: ApiKeyPermissions
      expires_at:
        type: optional<datetime>
        docs: Immutable absolute expiry. Omitted when the credential does not expire.
      used_at:
        type: optional<datetime>
        docs: Last time this key signed an admitted request, when known.
      created_at: datetime
      updated_at: datetime

  CreatePublicKeyRequest:
    docs: |
      Register only a public P-256 JWK. Credential type, `api_key_id`, sign-in
      eligibility, permissions, and generation are server-owned and are not
      request properties.
    properties:
      public_key: PublicJwk
      client_id:
        type: optional<string>
        docs: |
          Caller-chosen alias, unique within the organization and reusable
          after deletion. Registration is idempotent on it: the same alias
          with the same key and bindings returns the existing credential, and
          a different key or bindings returns `409`. URL-safe labels such as
          `inbox-123-runtime`; no slash or `@`.
      name:
        type: optional<string>
        validation:
          minLength: 1
          maxLength: 256
        docs: Defaults to `AgentID key {first eight fingerprint characters}`.
      scope:
        type: optional<PublicKeyScope>
        docs: |
          Omit to inherit the registering bearer key's exact scope. An explicit
          scope must be the caller's scope or a live descendant.
      expires_at:
        type: optional<datetime>
        docs: |
          Future absolute expiry. Omit to inherit the registering bearer key's
          expiry. A child credential cannot outlive its creator.

  BrowserEnrollmentTransactionJti:
    type: string
    validation:
      minLength: 22
      maxLength: 22
      pattern: "^[A-Za-z0-9_-]{22}$"
    docs: Transaction identifier read from an enrollment action on exactly `https://auth.agentid.com`.

  ApiKeyPermissions:
    docs: Granular permissions for the API key. When ommitted all permissions are granted. Otherwise, only permissions set to true are granted.
    properties:
      inbox_read:
        type: optional<boolean>
        docs: Read inbox details.
      inbox_create:
        type: optional<boolean>
        docs: Create new inboxes.
      inbox_update:
        type: optional<boolean>
        docs: Update inbox settings.
      inbox_delete:
        type: optional<boolean>
        docs: Delete inboxes.
      message_read:
        type: optional<boolean>
        docs: Read messages. Also required to read threads.
      message_send:
        type: optional<boolean>
        docs: Send messages.
      message_update:
        type: optional<boolean>
        docs: Update message labels. Also required to update threads.
      message_delete:
        type: optional<boolean>
        docs: Delete messages. Also required to delete threads.
      label_spam_read:
        type: optional<boolean>
        docs: Access messages labeled spam.
      label_blocked_read:
        type: optional<boolean>
        docs: Access messages labeled blocked.
      label_unauthenticated_read:
        type: optional<boolean>
        docs: Access messages labeled unauthenticated.
      label_trash_read:
        type: optional<boolean>
        docs: Access messages labeled trash.
      draft_read:
        type: optional<boolean>
        docs: Read drafts.
      draft_create:
        type: optional<boolean>
        docs: Create drafts.
      draft_update:
        type: optional<boolean>
        docs: Update drafts.
      draft_delete:
        type: optional<boolean>
        docs: Delete drafts.
      draft_send:
        type: optional<boolean>
        docs: Send drafts.
      webhook_read:
        type: optional<boolean>
        docs: Read webhook configurations.
      webhook_create:
        type: optional<boolean>
        docs: Create webhooks.
      webhook_update:
        type: optional<boolean>
        docs: Update webhooks.
      webhook_delete:
        type: optional<boolean>
        docs: Delete webhooks.
      domain_read:
        type: optional<boolean>
        docs: Read domain details.
      domain_create:
        type: optional<boolean>
        docs: Create domains.
      domain_update:
        type: optional<boolean>
        docs: Update domains.
      domain_delete:
        type: optional<boolean>
        docs: Delete domains.
      list_entry_read:
        type: optional<boolean>
        docs: Read list entries.
      list_entry_create:
        type: optional<boolean>
        docs: Create list entries.
      list_entry_delete:
        type: optional<boolean>
        docs: Delete list entries.
      metrics_read:
        type: optional<boolean>
        docs: Read metrics.
      api_key_read:
        type: optional<boolean>
        docs: Read API keys.
      api_key_create:
        type: optional<boolean>
        docs: Create API keys.
      api_key_update:
        type: optional<boolean>
        docs: Update API keys.
      api_key_delete:
        type: optional<boolean>
        docs: Delete API keys.
      pod_read:
        type: optional<boolean>
        docs: Read pods.
      pod_create:
        type: optional<boolean>
        docs: Create pods.
      pod_delete:
        type: optional<boolean>
        docs: Delete pods.

  BearerApiKey:
    docs: An API key presented as a bearer token in the `Authorization` header.
    properties:
      type: literal<"bearer">
      api_key_id: ApiKeyId
      prefix: Prefix
      name: Name
      pod_id:
        type: optional<string>
        docs: Pod ID the api key is scoped to. If set, the key can only access resources within this pod.
      inbox_id:
        type: optional<string>
        docs: Inbox ID the api key is scoped to. If set, the key can only access resources within this inbox.
      used_at:
        type: optional<datetime>
        docs: Time at which api key was last used.
      permissions: optional<ApiKeyPermissions>
      created_at: CreatedAt

  ApiKeyCreator:
    properties:
      api_key_id: ApiKeyId

  BrowserApiKeyStatus:
    enum:
      - pending
      - active
    docs: |
      `pending` until the browser finishes creating its key on the AgentID
      page; `active` once it can sign in as the inbox.

  BrowserApiKey:
    docs: |
      A public key held by a browser, scoped to one inbox: the key it uses to
      sign in as that inbox at AgentID relying parties. It has no secret and
      no permissions of its own: the browser proves possession of a
      non-extractable key, and the bearer API key in `created_by` bounds what
      it may do. Created by [Connect Provider](/api-reference/providers/connect),
      [Connect Browser](/api-reference/providers/connect-browser), or
      [Authorize Inbox](/api-reference/inboxes/authorize).
      It answers with the same fields as a registered public key plus
      `status`; `public_key` appears once the browser has proved its key.
    properties:
      type: literal<"public_key">
      api_key_id: ApiKeyId
      organization_id: global.OrganizationId
      pod_id:
        type: string
        docs: Pod of the inbox the browser signs in as.
      inbox_id:
        type: string
        docs: Inbox the browser signs in as.
      status: BrowserApiKeyStatus
      name:
        type: Name
        docs: Server-assigned, `Browser · <inbox_id>`.
      scope:
        type: PublicKeyScope
        docs: Always the inbox scope; the same value as `inbox_id`.
      public_key:
        type: optional<PublicKeyMaterial>
        docs: The browser's public key once `status` is `active`; absent while pending.
      client_id:
        type: optional<string>
        docs: |
          The name given at connect, unique within the organization across
          every public key. Get and Delete accept it in place of `api_key_id`.
      permissions:
        type: ApiKeyPermissions
        docs: Always empty; a browser key borrows its authority from the key in `created_by`.
      created_by:
        type: ApiKeyCreator
        docs: The bearer API key that created it. Deleting that key revokes this one.
      created_at: CreatedAt
      updated_at: datetime
      expires_at:
        type: datetime
        docs: |
          While pending, the deadline for the browser to finish. Once active,
          at most 30 days after activation and never later than the
          authorizing key's own expiry.
      used_at:
        type: optional<datetime>
        docs: Not recorded for browser keys today.

  ApiKey:
    docs: |
      One credential of any family. `type` is `bearer` or `public_key`. A
      public key carrying `status` is a browser key; one without it is a
      registered signing key.
    discriminated: false
    union:
      - BearerApiKey
      - BrowserApiKey
      - PublicKeyCredential

  ApiKeyType:
    enum:
      - bearer
      - public_key

  CreateApiKeyResponse:
    properties:
      api_key_id: ApiKeyId
      api_key:
        type: string
        docs: API key.
      prefix: Prefix
      name: Name
      pod_id:
        type: optional<string>
        docs: Pod ID the api key is scoped to.
      inbox_id:
        type: optional<string>
        docs: Inbox ID the api key is scoped to.
      permissions: optional<ApiKeyPermissions>
      created_at: CreatedAt

  ListApiKeysResponse:
    properties:
      count: global.Count
      next_page_token: optional<global.PageToken>
      api_keys:
        type: list<ApiKey>
        docs: |
          One credential family per request, ordered by `created_at`
          descending: bearer keys by default, every public key with
          `type=public_key`. Registered keys page first, then browser keys.

  CreateBearerApiKeyRequest:
    properties:
      name: optional<Name>
      permissions: optional<ApiKeyPermissions>

  CreateApiKeyRequest:
    docs: |
      A body with `public_key` registers a public-key credential; any other
      body mints a bearer key.
    discriminated: false
    union:
      - CreateBearerApiKeyRequest
      - CreatePublicKeyRequest

  CreateApiKeyResult:
    docs: The secret-bearing bearer key, or the registered public key without any secret.
    discriminated: false
    union:
      - CreateApiKeyResponse
      - PublicKeyCredential

  UpdateApiKeyRequest:
    docs: |
      Rename a credential or change its permissions. Key material, type,
      scope, and expiry are immutable.
    properties:
      name:
        type: optional<string>
        validation:
          minLength: 1
          maxLength: 256
      permissions: optional<ApiKeyPermissions>

service:
  url: Http
  base-path: /api-keys
  auth: true

  endpoints:
    list:
      method: GET
      path: ""
      display-name: List API Keys
      docs: |
        List one credential family: bearer keys by default, or every public
        key (registered and browser) with `type=public_key`.

        With `type=public_key`, `limit` is at most 100, `ascending` is not
        accepted, and pages continue until `next_page_token` is absent: a page
        can be empty and still carry a token, so page to token exhaustion, not
        to the first empty page.

        **CLI:**
        ```bash
        agentmail api-keys list
        ```
      request:
        name: ListApiKeysRequest
        query-parameters:
          type:
            type: optional<ApiKeyType>
            docs: Credential family to list. Defaults to `bearer`.
          inbox_id:
            type: optional<string>
            docs: |
              With `type=public_key`, return only keys scoped to this inbox,
              registered and browser alike.
          limit: optional<global.Limit>
          page_token: optional<global.PageToken>
          ascending:
            type: optional<global.Ascending>
            docs: Bearer keys only; rejected with `type=public_key`.
      response: ListApiKeysResponse

    get:
      method: GET
      path: /{api_key_id}
      display-name: Get API Key
      docs: |
        Get one credential of any family by ID. Registered public keys also
        resolve by their `client_id`. Requires `api_key_read`.

        For a browser key, poll this with the `api_key_id` from a connect
        call to learn when the browser has finished: `status` moves from
        `pending` to `active`. A key that expired, was deleted, or was
        never activated returns `404`. The `api_key_id` from connect is the
        key for its whole life, even when the browser proved material it
        already held for the inbox: it is the handle List and Delete accept.
      path-parameters:
        api_key_id: ApiKeyId
      response: ApiKey
      errors:
        - global.NotFoundError

    create:
      method: POST
      path: ""
      display-name: Create API Key
      docs: |
        Create one credential of any family. A body with a public JWK
        registers a public-key credential, optionally under a caller-chosen
        `client_id`, and returns it without any secret. Any other body mints
        a bearer key and returns its secret once. Browser keys are created by
        the connect endpoints and by
        [Authorize Inbox](/api-reference/inboxes/authorize), not here.
        Requires `api_key_create`.

        **CLI:**
        ```bash
        agentmail api-keys create --name "My Key"
        ```
      request: CreateApiKeyRequest
      response: CreateApiKeyResult
      errors:
        - global.ValidationError
        - global.ConflictError

    update:
      method: PATCH
      path: /{api_key_id}
      display-name: Update API Key
      docs: |
        Rename a bearer key or a registered public-key credential, or change
        its permissions. Public keys also resolve by `client_id`. A browser
        key has no mutable fields and answers `400`. Requires `api_key_update`.
      path-parameters:
        api_key_id: ApiKeyId
      request: UpdateApiKeyRequest
      response: ApiKey
      errors:
        - global.ValidationError
        - global.NotFoundError

    delete:
      method: DELETE
      path: /{api_key_id}
      display-name: Delete API Key
      docs: |
        Delete one credential of any family by ID. A registered public key
        also resolves by its `client_id`. A pending browser session is
        cancelled and its magic URL can no longer be used; an active one is
        revoked and can no longer sign in. Deleting a bearer key also revokes
        every browser session it authorized.

        **CLI:**
        ```bash
        agentmail api-keys delete --api-key-id <api_key_id>
        ```
      path-parameters:
        api_key_id: ApiKeyId
      errors:
        - global.NotFoundError

