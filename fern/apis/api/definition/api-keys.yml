# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  global: __package__.yml

types:
  ApiKeyId:
    type: string
    docs: ID of api key.

  Prefix:
    type: string
    docs: Prefix of api key.

  Name:
    type: string
    docs: Name of api key.

  CreatedAt:
    type: datetime
    docs: Time at which api key was created.

  PublicJwkCoordinate:
    type: string
    validation:
      minLength: 43
      maxLength: 43
      pattern: "^[A-Za-z0-9_-]{43}$"
    docs: A 32-byte P-256 coordinate encoded as unpadded base64url.

  PublicJwk:
    docs: |
      A public P-256 JWK. The object accepts exactly `kty`, `crv`, `x`, and `y`.
      Private key material such as `d`, embedded key IDs, and all other members
      are rejected. The server also rejects coordinates that are not a point on
      P-256.
    properties:
      kty: literal<"EC">
      crv: literal<"P-256">
      x: PublicJwkCoordinate
      y: PublicJwkCoordinate

  PublicKeyMaterial:
    docs: Registered public key material and its server-computed RFC 7638 thumbprint.
    properties:
      jwk: PublicJwk
      fingerprint:
        type: string
        validation:
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
        docs: RFC 7638 SHA-256 JWK thumbprint encoded as unpadded base64url.

  PublicKeyCredential:
    docs: |
      An AgentID sign-in credential, scoped like a bearer key. A key a browser
      holds carries `status` and gains `public_key` once the browser has
      proved it. `api_key_id` is the JWS `kid`.
    properties:
      type:
        type: literal<"public_key">
        docs: Server-owned credential discriminator. Callers cannot select or update it.
      api_key_id:
        type: uuid
        docs: Server-generated credential ID. Store this value as the signing key's `kid`.
      client_id:
        type: optional<string>
        docs: |
          Caller-chosen alias, unique within the organization. Get, Rename, and
          Revoke accept it in place of `api_key_id`.
      name:
        type: Name
        docs: Human-readable credential name.
      public_key:
        type: optional<PublicKeyMaterial>
        docs: The key material. Absent while a browser's key is still `pending`.
      pod_id:
        type: optional<string>
        docs: Pod the credential is scoped to. Absent on an organization-scoped credential.
      inbox_id:
        type: optional<string>
        docs: Inbox the credential is scoped to. Absent unless the credential is inbox-scoped.
      status:
        type: optional<PublicKeyStatus>
        docs: |
          Present on a key a browser holds: `pending` until the browser has
          created its key on the AgentID page, `active` once it can sign in as
          the inbox. Absent on a registered key.
      used_at:
        type: optional<datetime>
        docs: Last time this key signed an admitted request, when known.
      permissions:
        type: ApiKeyPermissions
        docs: |
          Granular permissions, as on a bearer key. A key a browser holds carries
          `provider_connect` and `provider_owner_share`, snapshotted from the
          bearer API key that created it and enforced from the key itself;
          change them with Update API Key.
      created_by:
        type: ApiKeyCreator
        docs: The bearer API key that registered or created it. Provenance only; the credential outlives it.
      created_at: datetime
      updated_at: datetime
      expires_at:
        type: optional<datetime>
        docs: |
          Immutable absolute expiry. Omitted when the credential does not
          expire. For a key a browser holds: while pending, the deadline for
          the browser to finish; once active, at most 30 days after activation.

  CreatePublicKeyRequest:
    docs: Registers a public P-256 JWK at the route's scope. `type` and `api_key_id` are server-owned.
    properties:
      public_key: PublicJwk
      client_id:
        type: optional<string>
        docs: |
          Caller-chosen alias, unique within the organization and reusable
          after deletion. Registration is idempotent on it: the same alias
          with the same key and bindings returns the existing credential, and
          a different key or bindings returns `409`. URL-safe labels such as
          `inbox-123-runtime`; no slash or `@`.
      name:
        type: optional<string>
        validation:
          minLength: 1
          maxLength: 256
        docs: Defaults to `AgentID key {first eight fingerprint characters}`.
      permissions:
        type: optional<ApiKeyPermissions>
        docs: |
          Granular permissions, as on a bearer key. Omitted inherits the
          registering bearer key's permissions; only grants that key holds may
          be set to true.
      expires_at:
        type: optional<datetime>
        docs: |
          Future absolute expiry. Omit to copy the registering bearer key's
          expiry at registration. The credential is independent of that key
          afterward: deleting, narrowing, or expiring the bearer does not
          affect it.

  BrowserEnrollmentTransactionJti:
    type: string
    validation:
      minLength: 22
      maxLength: 22
      pattern: "^[A-Za-z0-9_-]{22}$"
    docs: Transaction identifier read from an enrollment action on exactly `https://auth.agentid.com`.

  ApiKeyPermissions:
    docs: Granular permissions for the API key. When ommitted all permissions are granted. Otherwise, only permissions set to true are granted.
    properties:
      inbox_read:
        type: optional<boolean>
        docs: Read inbox details.
      inbox_create:
        type: optional<boolean>
        docs: Create new inboxes.
      inbox_update:
        type: optional<boolean>
        docs: Update inbox settings.
      inbox_delete:
        type: optional<boolean>
        docs: Delete inboxes.
      message_read:
        type: optional<boolean>
        docs: Read messages. Also required to read threads.
      message_send:
        type: optional<boolean>
        docs: Send messages.
      message_update:
        type: optional<boolean>
        docs: Update message labels. Also required to update threads.
      message_delete:
        type: optional<boolean>
        docs: Delete messages. Also required to delete threads.
      label_spam_read:
        type: optional<boolean>
        docs: Access messages labeled spam.
      label_blocked_read:
        type: optional<boolean>
        docs: Access messages labeled blocked.
      label_unauthenticated_read:
        type: optional<boolean>
        docs: Access messages labeled unauthenticated.
      label_trash_read:
        type: optional<boolean>
        docs: Access messages labeled trash.
      draft_read:
        type: optional<boolean>
        docs: Read drafts.
      draft_create:
        type: optional<boolean>
        docs: Create drafts.
      draft_update:
        type: optional<boolean>
        docs: Update drafts.
      draft_delete:
        type: optional<boolean>
        docs: Delete drafts.
      draft_send:
        type: optional<boolean>
        docs: Send drafts.
      webhook_read:
        type: optional<boolean>
        docs: Read webhook configurations.
      webhook_create:
        type: optional<boolean>
        docs: Create webhooks.
      webhook_update:
        type: optional<boolean>
        docs: Update webhooks.
      webhook_delete:
        type: optional<boolean>
        docs: Delete webhooks.
      domain_read:
        type: optional<boolean>
        docs: Read domain details.
      domain_create:
        type: optional<boolean>
        docs: Create domains.
      domain_update:
        type: optional<boolean>
        docs: Update domains.
      domain_delete:
        type: optional<boolean>
        docs: Delete domains.
      list_entry_read:
        type: optional<boolean>
        docs: Read list entries.
      list_entry_create:
        type: optional<boolean>
        docs: Create list entries.
      list_entry_delete:
        type: optional<boolean>
        docs: Delete list entries.
      metrics_read:
        type: optional<boolean>
        docs: Read metrics.
      api_key_read:
        type: optional<boolean>
        docs: Read API keys.
      api_key_create:
        type: optional<boolean>
        docs: Create API keys.
      api_key_update:
        type: optional<boolean>
        docs: Update API keys.
      api_key_delete:
        type: optional<boolean>
        docs: Delete API keys.
      provider_connect:
        type: optional<boolean>
        docs: |
          Sign in to providers as an inbox: connect a provider, authorize an inbox, and mint the
          keys browsers hold. Omitted on a new bearer key means false, whatever else the key holds.
      provider_owner_share:
        type: optional<boolean>
        docs: |
          Share the organization owner's name and email with providers at sign-in. One permission
          for both values.
      pod_read:
        type: optional<boolean>
        docs: Read pods.
      pod_create:
        type: optional<boolean>
        docs: Create pods.
      pod_delete:
        type: optional<boolean>
        docs: Delete pods.

  BearerApiKey:
    docs: An API key presented as a bearer token in the `Authorization` header.
    properties:
      type: literal<"bearer">
      api_key_id: ApiKeyId
      prefix: Prefix
      name: Name
      pod_id:
        type: optional<string>
        docs: Pod ID the api key is scoped to. If set, the key can only access resources within this pod.
      inbox_id:
        type: optional<string>
        docs: Inbox ID the api key is scoped to. If set, the key can only access resources within this inbox.
      used_at:
        type: optional<datetime>
        docs: Time at which api key was last used.
      permissions: optional<ApiKeyPermissions>
      created_at: CreatedAt
      updated_at: datetime
      expires_at:
        type: optional<datetime>
        docs: Absolute expiry. Omitted when the key does not expire.

  ApiKeyCreator:
    properties:
      api_key_id: ApiKeyId

  PublicKeyStatus:
    enum:
      - pending
      - active
    docs: |
      Lifecycle of a key a browser holds: `pending` until the browser finishes
      creating it on the AgentID page, `active` once it can sign in as the inbox.

  ApiKey:
    docs: |
      One credential of any family. `type` is `bearer` or `public_key`. A
      public key carrying `status` is one a browser holds; one without it is a
      registered signing key.
    discriminated: false
    union:
      - BearerApiKey
      - PublicKeyCredential

  ApiKeyType:
    enum:
      - bearer
      - public_key

  CreateApiKeyResponse:
    properties:
      api_key_id: ApiKeyId
      api_key:
        type: string
        docs: API key.
      prefix: Prefix
      name: Name
      pod_id:
        type: optional<string>
        docs: Pod ID the api key is scoped to.
      inbox_id:
        type: optional<string>
        docs: Inbox ID the api key is scoped to.
      permissions: optional<ApiKeyPermissions>
      created_at: CreatedAt

  ListApiKeysResponse:
    properties:
      count: global.Count
      next_page_token: optional<global.PageToken>
      api_keys:
        type: list<ApiKey>
        docs: |
          One credential family per request, ordered by `created_at`
          descending: bearer keys by default, every public key with
          `type=public_key`. Registered keys page first, then keys browsers hold.

  CreateBearerApiKeyRequest:
    properties:
      name: optional<Name>
      permissions: optional<ApiKeyPermissions>

  CreateApiKeyRequest:
    docs: |
      A body with `public_key` registers a public-key credential; any other
      body mints a bearer key.
    discriminated: false
    union:
      - CreateBearerApiKeyRequest
      - CreatePublicKeyRequest

  CreateApiKeyResult:
    docs: The secret-bearing bearer key, or the registered public key without any secret.
    discriminated: false
    union:
      - CreateApiKeyResponse
      - PublicKeyCredential

  UpdateApiKeyRequest:
    docs: |
      Rename a credential or change its permissions. Key material, type,
      scope, and expiry are immutable.
    properties:
      name:
        type: optional<string>
        validation:
          minLength: 1
          maxLength: 256
      permissions: optional<ApiKeyPermissions>

service:
  url: Http
  base-path: /api-keys
  auth: true

  endpoints:
    list:
      method: GET
      path: ""
      display-name: List API Keys
      docs: |
        Lists bearer keys by default, or every public key with `type=public_key`.
        Public keys page to token exhaustion: a page can be empty and still carry a
        `next_page_token`.

        **CLI:**
        ```bash
        agentmail api-keys list
        ```
      request:
        name: ListApiKeysRequest
        query-parameters:
          type:
            type: optional<ApiKeyType>
            docs: Credential family to list. Defaults to `bearer`.
          inbox_id:
            type: optional<string>
            docs: |
              With `type=public_key`, return only keys scoped to this inbox,
              registered and browser alike.
          limit: optional<global.Limit>
          page_token: optional<global.PageToken>
          ascending:
            type: optional<global.Ascending>
            docs: Bearer keys only; rejected with `type=public_key`.
      response: ListApiKeysResponse

    get:
      method: GET
      path: /{api_key_id}
      display-name: Get API Key
      docs: |
        Returns one credential of any family. Public keys also resolve by
        `client_id`. Poll a browser-held key until `status` is `active`.
      path-parameters:
        api_key_id: ApiKeyId
      response: ApiKey
      errors:
        - global.NotFoundError

    create:
      method: POST
      path: ""
      display-name: Create API Key
      docs: |
        Creates a bearer key, or registers a public key when the body carries
        `public_key`. The route selects the scope. Bearer secrets are returned once.

        **CLI:**
        ```bash
        agentmail api-keys create --name "My Key"
        ```
      request: CreateApiKeyRequest
      response: CreateApiKeyResult
      errors:
        - global.ValidationError
        - global.ConflictError

    update:
      method: PATCH
      path: /{api_key_id}
      display-name: Update API Key
      docs: |
        Renames a credential or changes its permissions. Public keys also resolve
        by `client_id`; a browser-held key accepts only `provider_connect` and
        `provider_owner_share`.
      path-parameters:
        api_key_id: ApiKeyId
      request: UpdateApiKeyRequest
      response: ApiKey
      errors:
        - global.ValidationError
        - global.NotFoundError

    delete:
      method: DELETE
      path: /{api_key_id}
      display-name: Delete API Key
      docs: |
        Deletes one credential of any family. A pending browser-held key is
        cancelled; an active one is revoked. Public keys also resolve by `client_id`.

        **CLI:**
        ```bash
        agentmail api-keys delete --api-key-id <api_key_id>
        ```
      path-parameters:
        api_key_id: ApiKeyId
      errors:
        - global.NotFoundError

