# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  global: __package__.yml
  pods: pods/__package__.yml

types:
  DomainId:
    type: string
    docs: The ID of the domain.

  DomainName:
    type: string
    docs: The name of the domain (e.g., `example.com`).

  RecordType:
    enum:
      - TXT
      - CNAME
      - MX

  VerificationStatus:
    enum:
      - NOT_STARTED
      - PENDING
      - INVALID
      - FAILED
      - VERIFYING
      - VERIFIED

  RecordStatus:
    enum:
      - MISSING
      - INVALID
      - VALID

  VerificationRecord:
    properties:
      type:
        type: RecordType
        docs: The type of the DNS record.
      name:
        type: string
        docs: The name or host of the record.
      value:
        type: string
        docs: The value of the record.
      status:
        type: RecordStatus
        docs: The verification status of this specific record.
      priority:
        type: optional<integer>
        docs: The priority of the MX record.
      reason:
        type: optional<string>
        docs: >-
          Why the record is INVALID, when known. `duplicate_records` means the expected value is
          present but extra records coexist at the same name; `value_mismatch` means a record
          exists but does not match the expected value.

  Status:
    type: VerificationStatus
    docs: The verification status of the domain.

  FeedbackEnabled:
    type: boolean
    docs: Bounce and complaint notifications are sent to your inboxes.

  SubdomainsEnabled:
    type: boolean
    docs: |
      Allow inboxes on any subdomain of this domain. Adds a required wildcard MX
      record (`*.<domain>`) to `records`.

  TrackingEnabled:
    type: boolean
    docs: |
      Serve open tracking pixels from this domain. Adds a required `link.<domain>`
      CNAME record to `records`, which must be published and verified before
      `track_opens` can be used on a send.

  ClientId:
    type: string
    docs: Client ID of domain.

  Domain:
    properties:
      pod_id: optional<pods.PodId>
      domain_id: DomainId
      domain: DomainName
      status: Status
      reason:
        type: optional<string>
        docs: >-
          Why the domain is not (yet) VERIFIED, when known. `dns_records_missing` /
          `dns_records_invalid` point at the DNS records; `ses_dkim_pending`, `ses_dkim_failed`,
          `ses_mail_from_pending`, `ses_mail_from_failed`, and `ses_not_verified_for_sending`
          mean the records look right and sending-infrastructure validation has not converged.
          Absent when VERIFIED.
      feedback_enabled: FeedbackEnabled
      subdomains_enabled: SubdomainsEnabled
      tracking_enabled: TrackingEnabled
      records:
        type: list<VerificationRecord>
        docs: |
          A list of DNS records required to verify the domain. Includes a
          wildcard MX record (`*.<domain>`) when `subdomains_enabled` is true.
      client_id: optional<ClientId>
      updated_at:
        type: datetime
        docs: Time at which the domain was last updated.
      created_at:
        type: datetime
        docs: Time at which the domain was created.

  DomainItem:
    properties:
      pod_id: optional<pods.PodId>
      domain_id: DomainId
      domain: DomainName
      feedback_enabled: FeedbackEnabled
      subdomains_enabled: SubdomainsEnabled
      tracking_enabled: TrackingEnabled
      client_id: optional<ClientId>
      updated_at:
        type: datetime
        docs: Time at which the domain was last updated.
      created_at:
        type: datetime
        docs: Time at which the domain was created.

  ListDomainsResponse:
    properties:
      count: global.Count
      limit: optional<global.Limit>
      next_page_token: optional<global.PageToken>
      domains:
        type: list<DomainItem>
        docs: Ordered by `created_at` descending.

  GetSetupLinkResponse:
    properties:
      supported:
        type: boolean
        docs: >-
          Whether one-click setup is available for this domain. `false` means the domain's DNS
          provider does not support Domain Connect (or does not carry the AgentMail template yet)
          — add the domain's `records` manually instead.
      provider_name:
        type: optional<string>
        docs: Display name of the domain's DNS provider, for the setup button label.
      url:
        type: optional<string>
        docs: >-
          The signed Domain Connect apply URL. Open it in a browser: the domain owner signs in at
          their DNS provider, reviews the records, and approves — the provider writes them.
      width:
        type: optional<integer>
        docs: Suggested popup width from the provider, in pixels.
      height:
        type: optional<integer>
        docs: Suggested popup height from the provider, in pixels.
      state:
        type: optional<string>
        docs: >-
          Opaque value echoed back on the provider's redirect. Store it before opening the URL
          and compare on return to tie the redirect to this request.
      conflicting_provider:
        type: optional<string>
        docs: >-
          Set when the domain currently has another email provider's MX records (for example
          Google Workspace). Applying the template would replace them — warn before proceeding.

  CreateDomainRequest:
    properties:
      domain: DomainName
      feedback_enabled: optional<FeedbackEnabled>
      subdomains_enabled: optional<SubdomainsEnabled>
      tracking_enabled: optional<TrackingEnabled>

  UpdateDomainRequest:
    docs: |
      Provide at least one of `feedback_enabled`, `subdomains_enabled`, or
      `tracking_enabled`. Omitted
      fields are left unchanged; an empty body is rejected. Enabling
      `subdomains_enabled` on a verified domain returns it to `PENDING` until the
      newly-required wildcard MX record (`*.<domain>`) is published and verified.
    properties:
      feedback_enabled: optional<FeedbackEnabled>
      subdomains_enabled: optional<SubdomainsEnabled>
      tracking_enabled: optional<TrackingEnabled>

service:
  url: Http
  base-path: /domains
  auth: true

  endpoints:
    list:
      method: GET
      path: ""
      display-name: List Domains
      docs: |
        **CLI:**
        ```bash
        agentmail domains list
        ```
      request:
        name: ListDomainsRequest
        query-parameters:
          limit: optional<global.Limit>
          page_token: optional<global.PageToken>
          ascending: optional<global.Ascending>
      response: ListDomainsResponse

    get:
      method: GET
      path: /{domain_id}
      display-name: Get Domain
      docs: |
        **CLI:**
        ```bash
        agentmail domains get --domain-id <domain_id>
        ```
      path-parameters:
        domain_id: DomainId
      response: Domain
      errors:
        - global.NotFoundError

    getZoneFile:
      method: GET
      path: /{domain_id}/zone-file
      display-name: Get Zone File
      docs: |
        **CLI:**
        ```bash
        agentmail domains get-zone-file --domain-id <domain_id>
        ```
      path-parameters:
        domain_id: DomainId
      response: file
      errors:
        - global.NotFoundError

    create:
      method: POST
      path: ""
      display-name: Create Domain
      docs: |
        **CLI:**
        ```bash
        agentmail domains create --domain example.com
        ```
      request: CreateDomainRequest
      response: Domain
      errors:
        - global.ValidationError

    update:
      method: PATCH
      path: /{domain_id}
      display-name: Update Domain
      docs: |
        **CLI:**
        ```bash
        agentmail domains update --domain-id <domain_id>
        ```
      path-parameters:
        domain_id: DomainId
      request: UpdateDomainRequest
      response: Domain
      errors:
        - global.NotFoundError

    delete:
      method: DELETE
      path: /{domain_id}
      display-name: Delete Domain
      docs: |
        **CLI:**
        ```bash
        agentmail domains delete --domain-id <domain_id>
        ```
      path-parameters:
        domain_id: DomainId
      errors:
        - global.NotFoundError

    verify:
      method: POST
      path: /{domain_id}/verify
      display-name: Verify Domain
      docs: |
        **CLI:**
        ```bash
        agentmail domains verify --domain-id <domain_id>
        ```
      path-parameters:
        domain_id: DomainId
      errors:
        - global.NotFoundError

    getSetupLink:
      method: GET
      path: /{domain_id}/setup-link
      display-name: Get Setup Link
      docs: >-
        Build a one-click DNS setup link for the domain via the Domain Connect standard. When the
        domain's DNS provider supports Domain Connect and carries the AgentMail template, the
        response contains a signed URL: opening it lets the domain owner approve the required DNS
        records at their provider, which writes them automatically — no copy-paste. When the
        provider does not support it, `supported` is `false` and the domain's `records` should be
        added manually instead.
      path-parameters:
        domain_id: DomainId
      response: GetSetupLinkResponse
      errors:
        - global.NotFoundError
        - global.ConflictError
        - global.UnprocessableError
