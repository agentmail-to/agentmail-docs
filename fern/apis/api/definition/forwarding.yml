# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  global: __package__.yml

types:
  ForwardingDestination:
    type: string
    docs: |
      Email address that receives a copy of each email. Stored trimmed and lowercased, at most 320
      characters.

  Forwarding:
    properties:
      destinations:
        type: nullable<list<ForwardingDestination>>
        docs: |
          Addresses this level forwards to. `null` when the level sets nothing and uses the forwarding
          of the level above. An empty list means forwarding is turned off at this level, even when a
          level above forwards.
      unverified:
        type: list<ForwardingDestination>
        docs: |
          Addresses in `destinations` that receive nothing yet because they are not verified, or because
          the address now reaches a different AgentMail inbox than the one it was verified for. Verify
          them with Start Verification and Confirm Verification. Empty when `destinations` is `null`.

  UpdateForwardingRequest:
    properties:
      destinations:
        type: list<ForwardingDestination>
        docs: |
          The full list of addresses this level forwards to. It replaces the level's current list. At
          most 5, with no repeats. Send an empty list to turn forwarding off at this level, even when a
          level above forwards.

  UpdateForwardingResponse:
    properties:
      destinations:
        type: list<ForwardingDestination>
        docs: |
          The list now set on this level. It does not say which addresses are verified; Get Forwarding
          does.

  StartForwardingVerificationRequest:
    properties:
      destination:
        type: ForwardingDestination
        docs: Address to verify. AgentMail emails it a confirmation code.

  ForwardingVerificationStarted:
    properties:
      expires_at:
        type: datetime
        docs: Time at which the emailed code stops working, 24 hours after it was sent.

  ConfirmForwardingVerificationRequest:
    properties:
      destination:
        type: ForwardingDestination
        docs: Address the code was sent to.
      code:
        type: string
        docs: |
          The 10-character code from the email, shown as `XXXXX-XXXXX`. Case, spaces and the dash are
          ignored.

  ForwardingVerificationConfirmed:
    properties:
      verified_at:
        type: datetime
        docs: Time at which the address was verified.

service:
  url: Http
  base-path: /forwarding
  auth: true

  endpoints:
    get:
      method: GET
      path: ""
      display-name: Get Forwarding
      docs: |
        Get the forwarding the organization sets. Pods and inboxes that set no forwarding of their own
        use this list. Needs an organization-scoped API key.

        **CLI:**
        ```bash
        agentmail forwarding get
        ```
      response: Forwarding
      errors:
        - ForwardingForbiddenError

    update:
      method: PUT
      path: ""
      display-name: Update Forwarding
      docs: |
        Set the addresses the organization forwards to. The list replaces the current one. An address
        that is not verified is saved but receives nothing until it is verified. Needs an
        organization-scoped API key in an organization that has completed agent verification.

        **CLI:**
        ```bash
        agentmail forwarding update --destinations ops@example.com --destinations archive@example.com
        ```
      request: UpdateForwardingRequest
      response: UpdateForwardingResponse
      errors:
        - global.ValidationError
        - ForwardingForbiddenError

    delete:
      method: DELETE
      path: ""
      display-name: Delete Forwarding
      docs: |
        Remove the organization's forwarding, so its inboxes stop forwarding unless their pod or the
        inbox sets its own. Verified addresses stay verified, so adding one again needs no new code.
        Returns `not_found` when the organization sets no forwarding.

        **CLI:**
        ```bash
        agentmail forwarding delete
        ```
      response: Forwarding
      errors:
        - global.NotFoundError
        - ForwardingForbiddenError

    startVerification:
      method: POST
      path: /verifications
      display-name: Start Verification
      docs: |
        Email a confirmation code to an address, so it can receive forwarded mail once confirmed.
        Verification belongs to the organization: once verified, the address can be used at the
        organization, any pod and any inbox. Starting again replaces any code already sent to the
        address. Needs an organization- or pod-scoped API key in an organization that has completed
        agent verification.

        **CLI:**
        ```bash
        agentmail forwarding start-verification --destination ops@example.com
        ```
      request: StartForwardingVerificationRequest
      response: ForwardingVerificationStarted
      errors:
        - global.ValidationError
        - ForwardingForbiddenError
        - global.UnprocessableError
        - ForwardingRateLimitError

    confirmVerification:
      method: POST
      path: /verifications/confirm
      display-name: Confirm Verification
      docs: |
        Submit the code emailed by Start Verification to verify the address. A code allows 10 wrong
        attempts, then stops working even with the right code, and Start Verification sends a new one.
        Needs an organization- or pod-scoped API key in an organization that has completed agent
        verification.

        **CLI:**
        ```bash
        agentmail forwarding confirm-verification --destination ops@example.com --code 7KQ2M-XW9PD
        ```
      request: ConfirmForwardingVerificationRequest
      response: ForwardingVerificationConfirmed
      errors:
        - global.ValidationError
        - ForwardingForbiddenError
        - global.ConflictError

errors:
  ForwardingForbiddenError:
    status-code: 403
    type: global.ErrorResponse
    docs: |
      `code` says why. `missing_permission` when the API key lacks the permission the endpoint needs,
      including an inbox- or pod-scoped key on the organization's forwarding, an inbox-scoped key on
      Start or Confirm Verification, and any change other than an inbox's forwarding in an organization
      that hasn't completed agent verification. `account_suspended` when the organization is suspended
      (Start Verification). For Confirm Verification, `forbidden` when no code is outstanding for the
      address (none was sent, it was used, or it expired) or the code is wrong, with `message` saying how
      many attempts remain, and `limit_exceeded` when the code has used all its attempts. When no code
      is outstanding or no attempts remain, call Start Verification for a new code.

  ForwardingRateLimitError:
    status-code: 429
    type: global.ErrorResponse
    docs: |
      Too many confirmation codes were sent to this address or by this organization. An address gets
      one code every 5 minutes and 5 a day, and an organization 25 a day, counted together with pod
      owner confirmation emails. Wait, then start the verification again. The response has no
      `Retry-After` header.
