# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  global: __package__.yml
  accounts: accounts.yml
  inboxes: inboxes/__package__.yml
  api-keys: api-keys.yml

types:
  Provider:
    docs: A provider an inbox can sign in to.
    properties:
      provider_id: accounts.ProviderId
      name: optional<string>
      updated_at:
        type: optional<datetime>
        docs: Time at which provider was last updated.
      description: optional<string>
      logo_url: optional<string>
      terms_url: optional<string>
      privacy_url: optional<string>

  ListProvidersResponse:
    properties:
      count: global.Count
      limit: global.Limit
      next_page_token: optional<global.PageToken>
      providers: list<Provider>

  SearchProvidersResponse:
    properties:
      count: global.Count
      limit: global.Limit
      providers: list<Provider>

  ListProviderAccountsResponse:
    properties:
      provider: optional<Provider>
      count: global.Count
      limit: global.Limit
      next_page_token: optional<global.PageToken>
      accounts: list<accounts.Account>

  ConnectInboxId:
    type: inboxes.InboxId
    docs: Inbox to sign in as. Required unless the API key is scoped to an inbox.

  ConnectProviderBody:
    docs: The legacy `Idempotency-Key` header is read as `client_id` when the body omits it.
    properties:
      inbox_id: optional<ConnectInboxId>
      client_id: optional<api-keys.PublicKeyClientId>
      authorize: optional<api-keys.Authorize>

  ConnectBrowserBody:
    extends: ConnectProviderBody
    properties:
      provider:
        type: optional<string>
        docs: |
          Provider to continue to after enrollment, as an approved domain or
          HTTPS URL such as `smolmachines.com`. Matching is exact; an unknown
          domain returns `404`. Omit to stop on AgentID once the key is active.

  MagicUrl:
    type: string
    docs: |
      Single-use URL to open in the browser that will hold the key. Absent when
      a repeated `client_id` resolved to a key that is already active.

  ConnectAccepted:
    docs: The pending public key the browser will activate. Poll Get API Key with `api_key_id` for `status`.
    properties:
      api_key_id: api-keys.ApiKeyId
      magic_url: optional<MagicUrl>
      expires_at: api-keys.ExpiresAt

service:
  url: Http
  base-path: /providers
  auth: true

  endpoints:
    list:
      method: GET
      path: ""
      display-name: List Providers
      docs: Lists providers, most popular first.
      request:
        name: ListProvidersRequest
        query-parameters:
          limit: optional<global.Limit>
          page_token: optional<global.PageToken>
      response: ListProvidersResponse
      errors:
        - global.ValidationError

    search:
      method: GET
      path: /search
      display-name: Search Providers
      docs: Searches providers by name prefix.
      request:
        name: SearchProvidersRequest
        query-parameters:
          q:
            type: string
            docs: Name prefix to search for.
          limit: optional<global.Limit>
      response: SearchProvidersResponse
      errors:
        - global.ValidationError

    get:
      method: GET
      path: /{provider_id}
      display-name: Get Provider
      path-parameters:
        provider_id: accounts.ProviderId
      response: Provider
      errors:
        - global.NotFoundError

    listAccounts:
      method: GET
      path: /{provider_id}/accounts
      display-name: List Provider Accounts
      docs: Lists accounts at one provider, most recent sign-in first.
      path-parameters:
        provider_id: accounts.ProviderId
      request:
        name: ListProviderAccountsRequest
        query-parameters:
          limit: optional<global.Limit>
          page_token: optional<global.PageToken>
      response: ListProviderAccountsResponse
      errors:
        - global.ValidationError

    connect:
      method: POST
      path: /{provider_id}/connect
      display-name: Connect Provider
      docs: |
        Starts signing an inbox in to a provider. Returns a single-use `magic_url`,
        valid for five minutes, to open in the browser that will hold the sign-in;
        the browser enrolls as the inbox and continues to the provider. Poll
        [Get API Key](/api-reference/api-keys/get) with `api_key_id` for `status`.
        Repeating a `client_id` answers from the key it names: `409` while pending,
        `200` once active, a new key once it has expired or been deleted.
      path-parameters:
        provider_id: accounts.ProviderId
      idempotent: true
      request:
        name: ConnectProviderRequest
        body: optional<ConnectProviderBody>
      response:
        status-code: 202
        type: ConnectAccepted
      errors:
        - global.ValidationError
        - global.NotFoundError
        - global.ConflictError

    connectBrowser:
      method: POST
      path: /connect
      display-name: Connect Browser
      docs: |
        Enrolls a browser as an inbox by magic URL. With `provider`, continues to
        that provider's sign-in after enrollment; without it, stops on AgentID once
        the key is active. Otherwise behaves as Connect Provider.
      idempotent: true
      request:
        name: ConnectBrowserRequest
        body: optional<ConnectBrowserBody>
      response:
        status-code: 202
        type: ConnectAccepted
      errors:
        - global.ValidationError
        - global.NotFoundError
        - global.ConflictError
