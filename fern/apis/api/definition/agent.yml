# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  global: __package__.yml

types:
  AgentSignupRequest:
    docs: Request body to sign up an agent.
    properties:
      human_email:
        type: optional<string>
        docs: |
          Email address of the human who owns the agent. A 6-digit OTP will be sent to this address.
          Omit it to get a receive-only inbox: it can receive email but cannot send until a human is attached with the attach human endpoint.
      username:
        type: string
        docs: Username for the auto-created inbox (e.g. "my-agent" creates my-agent@agentmail.to).
      source:
        type: optional<string>
        docs: |
          The SDK, framework, or platform issuing this sign-up (e.g. `agentmail-python`, `agentmail-cli`, `agentmail-mcp`).
          Identifies the caller — answers "who is signing up".
          Max 2048 characters.
      referrer:
        type: optional<string>
        docs: |
          The channel that drove this sign-up — where the agent or its developer discovered AgentMail
          (e.g. `agent.email`, a partner URL, a campaign tag). Answers "where did this sign-up come from".
          Max 2048 characters.

  AgentSignupResponse:
    docs: Response after successful agent sign-up.
    properties:
      organization_id:
        type: string
        docs: ID of the created organization.
      inbox_id:
        type: string
        docs: ID of the auto-created inbox.
      api_key:
        type: string
        docs: API key for authenticating subsequent requests. Store this securely, it cannot be retrieved again.

  AgentAttachHumanRequest:
    docs: Request body to attach a human to an agent organization.
    properties:
      human_email:
        type: string
        docs: Email address of the human who owns the agent. A 6-digit OTP will be sent to this address.

  AgentAttachHumanResponse:
    docs: Response after attaching a human to an agent organization.
    properties:
      human_email:
        type: string
        docs: Email address of the attached human.
      instructions:
        type: string
        docs: Next steps for the agent, in plain text.

  AgentVerifyRequest:
    docs: Request body to verify an agent with an OTP code.
    properties:
      otp_code:
        type: string
        docs: 6-digit verification code sent to the human's email address.

  AgentVerifyResponse:
    docs: Response after successful agent verification.
    properties:
      verified:
        type: boolean
        docs: Whether the organization was verified.

service:
  url: Http
  base-path: /agent
  auth: false

  endpoints:
    signUp:
      method: POST
      path: /sign-up
      display-name: Sign Up
      docs: |
        Create a new agent organization with an inbox and API key. This endpoint is for signing up for the first time. If you've already signed up, you're all set — just use your existing API key.

        A 6-digit OTP is sent to the human's email for verification.

        `human_email` is optional. Without it, the inbox can receive email but cannot send to anyone until a human is attached with the attach human endpoint, or claims the inbox at https://console.agentmail.to/claim with the API key. There is also no way to recover the API key, so store it durably. Calling sign-up again without `human_email` creates a new organization, which needs a different `username`: the original username stays with the lost organization's inbox.

        This endpoint is idempotent. Calling it again with the same `human_email` will rotate the API key and resend the OTP if expired.

        The returned API key has limited permissions until the organization is verified via the verify endpoint.

        **CLI:**
        ```bash
        agentmail agent sign-up --human-email user@example.com --username my-agent
        ```
      request: AgentSignupRequest
      response: AgentSignupResponse
      errors:
        - global.ValidationError

    attachHuman:
      method: POST
      path: /human
      display-name: Attach Human
      auth: true
      docs: |
        Attach a human to an unverified agent organization. A 6-digit OTP is sent to the human's email, which you then submit to the verify endpoint.

        Use it after signing up without a `human_email`. Once the human is attached, the organization can send email to that human only, and verification lifts the remaining restrictions. For up to 5 minutes after attaching, sends to the human can still be rejected with a `429` daily send limit error while the API key's cached limits catch up. Wait and retry.

        Calling it again with the same `human_email` does not rotate the API key. It resends the OTP if it was never delivered, or issues a new one if it expired. While the current OTP is still valid, calling it again keeps that OTP and its attempt count. If all 10 attempts are used up, wait until the OTP expires, 24 hours after it was issued, then call it again for a new one.

        Calling it with a different `human_email` replaces the attached human and sends the new human an OTP. An organization can replace its human at most 2 times.

        Only available until the organization is verified.

        **CLI:**
        ```bash
        agentmail agent attach-human --human-email user@example.com
        ```
      request: AgentAttachHumanRequest
      response: AgentAttachHumanResponse
      errors:
        - global.ValidationError
        - global.ConflictError

    verify:
      method: POST
      path: /verify
      display-name: Verify
      auth: true
      docs: |
        Verify an agent organization using the 6-digit OTP sent to the human's email during sign-up.

        On success, the organization is upgraded from `agent_unverified` to `agent_verified`, the send allowlist is removed, and free plan entitlements are applied.

        The OTP expires after 24 hours and allows a maximum of 10 attempts. If the OTP expired, call the attach human endpoint with the same `human_email` to get a new one without rotating the API key. Once all 10 attempts are used, even the correct OTP is rejected, and attach human keeps returning the same OTP until it expires, so wait for it to expire before asking for a new one. An organization that signed up without a `human_email` has no OTP until a human is attached. If you run into any difficulties receiving the OTP code, you can also create an account on [console.agentmail.to](https://console.agentmail.to) using the human email address you provided to verify your account.

        **CLI:**
        ```bash
        agentmail agent verify --otp-code 123456
        ```
      request: AgentVerifyRequest
      response: AgentVerifyResponse
