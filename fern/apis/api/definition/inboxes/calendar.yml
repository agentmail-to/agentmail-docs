    getEvent:
      method: GET
      path: /events/{event_id}
      display-name: Get Event
      docs: |
        Gets an event by its UUID, or one date of a recurring event by its dated ID
        (`<uuid>_<slot>`). A dated ID returns the date as it currently stands, including any edit
        to it, with `kind: instance`.

        The `ETag` response header is the value to send in `If-Match` when updating, deleting or
        responding to this event or date. For a dated ID the `ETag` is opaque (`"occ-..."`); always
        copy it from this header.

        `consistency` applies to UUIDs only; dated IDs are always read from the primary region.
        Requires the `calendar_event_read` permission.
      path-parameters:
        event_id: calendar.CalendarEventId
      request:
        name: GetCalendarEventRequest
        query-parameters:
          consistency: optional<calendar.CalendarConsistency>
      response: calendar.CalendarEvent
      errors:
        - global.ValidationError
        - calendar.ForbiddenError
        - global.NotFoundError
        - calendar.EventExpiredError
      examples:
        - name:
            "One-off event"
          path-parameters:
            {
              "inbox_id": "scheduler@agentmail.to",
              "event_id": "3f8a2c1e-6b4d-4e9f-a7c2-5d1b8e0f9a36"
            }
          response:
            {
              "body": {
                "event_id": "3f8a2c1e-6b4d-4e9f-a7c2-5d1b8e0f9a36",
                "kind": "single",
                "title": "Intro call with Acme",
                "description": "Walk Jane through the onboarding plan.",
                "location": "https://meet.example.com/acme-intro",
                "metadata": {
                  "crm_deal_id": "D-1042"
                },
                "status": "confirmed",
                "all_day": false,
                "start": "2026-10-15T14:00:00",
                "end": "2026-10-15T14:30:00",
                "timezone": "America/New_York",
                "duration_mode": "exact",
                "duration_value": 1800000,
                "start_at": "2026-10-15T18:00:00Z",
                "end_at": "2026-10-15T18:30:00Z",
                "attendees": [
                  {
                    "email": "jane@acme.com",
                    "name": "Jane Doe",
                    "status": "needs_action",
                    "role": "required"
                  }
                ],
                "attendee_count": 1,
                "uid": "3f8a2c1e-6b4d-4e9f-a7c2-5d1b8e0f9a36@agentmail.to",
                "sequence": 0,
                "source": "api",
                "organizer_email": "scheduler@agentmail.to",
                "resource_revision": 0,
                "created_at": "2026-10-01T16:30:00Z",
                "updated_at": "2026-10-01T16:30:00Z"
              }
            }
        - name:
            "One date of a series"
          path-parameters:
            {
              "inbox_id": "scheduler@agentmail.to",
              "event_id": "7c4e9b2a-1f3d-4a8e-b6c5-2e9d0f1a8b47_t20261007T090000"
            }
          response:
            {
              "body": {
                "event_id": "7c4e9b2a-1f3d-4a8e-b6c5-2e9d0f1a8b47_t20261007T090000",
                "kind": "instance",
                "series_id": "7c4e9b2a-1f3d-4a8e-b6c5-2e9d0f1a8b47",
                "original_start": "2026-10-07T09:00:00",
                "original_start_at": "2026-10-07T13:00:00Z",
                "is_exception": false,
                "title": "Team standup",
                "location": "https://meet.example.com/standup",
