# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  global: ../__package__.yml
  inboxes: __package__.yml
  calendar: ../calendar.yml

service:
  url: Http
  base-path: /inboxes/{inbox_id}/calendar
  path-parameters:
    inbox_id: inboxes.InboxId
  auth: true

  endpoints:
    get:
      method: GET
      path: ""
      display-name: Get Calendar
      docs: |
        Gets the inbox's calendar. Every inbox has one calendar, so this works before any event is
        created. The `ETag` response header (`"rv-<n>"`) is the value to send in `If-Match` when
        updating it.

        Requires the `calendar_read` permission. Calendar is in private beta: organizations without
        access receive a `403`.
      request:
        name: GetCalendarRequest
        query-parameters:
          consistency: optional<calendar.CalendarConsistency>
      response: calendar.Calendar
      errors:
        - global.ValidationError
        - calendar.ForbiddenError
        - global.NotFoundError
      examples:
        - path-parameters:
            {
              "inbox_id": "scheduler@agentmail.to"
            }
          response:
            {
              "body": {
                "inbox_id": "scheduler@agentmail.to",
                "timezone": "America/New_York",
                "event_count": 2,
                "created_at": "2026-10-01T16:20:00Z",
                "updated_at": "2026-10-01T16:25:00Z"
              }
            }

    update:
      method: PATCH
      path: ""
      display-name: Update Calendar
      docs: |
        Updates the calendar's default time zone. Existing events keep their own `timezone`; only
        events created later without a `timezone` use the new default.

        Requires the `calendar_update` permission and an `If-Match` header with the calendar's
        current `ETag`. A stale `If-Match` returns `412`; a missing one returns `428`.
      request:
        name: UpdateCalendarRequestWrapper
        headers:
          If-Match:
            type: string
            docs: The calendar's current `ETag`, for example `"rv-0"`.
        body:
          extends: calendar.UpdateCalendarRequest
          properties: {}
      response: calendar.Calendar
      errors:
        - global.ValidationError
        - calendar.ForbiddenError
        - global.NotFoundError
        - global.ConflictError
        - calendar.PreconditionFailedError
        - calendar.PayloadTooLargeError
        - calendar.PreconditionRequiredError
      examples:
        - path-parameters:
            {
              "inbox_id": "scheduler@agentmail.to"
            }
          headers:
            {
              "If-Match": "\"rv-0\""
            }
          request:
            {
              "timezone": "America/New_York"
            }
          response:
            {
              "body": {
                "inbox_id": "scheduler@agentmail.to",
                "timezone": "America/New_York",
                "event_count": 2,
                "created_at": "2026-10-01T16:20:00Z",
                "updated_at": "2026-10-01T16:25:00Z"
              }
            }

    listEvents:
      method: GET
      path: /events
      display-name: List Events
      docs: |
        Lists the calendar's events in one of two views.

        - **Stored events** (default): one item per one-off or recurring event, plus one item for
          each edited date of a recurring event (as that dated event, with `is_exception: true`).
          Ordered by most recently updated. Use this view to sync or manage what you created.
        - **Agenda** (`expand=true`): every date in a time window, with recurring events expanded
          into their individual dates and cancelled dates left out. Ordered by start time. Use this
          view to answer "what is on the calendar". Agenda items omit `description`, `metadata` and
          `attendees`; get an event by ID for the full object. The window defaults to now through
          90 days from now and can be at most 366 days.

        `after`, `before` and `include_overlapping` require `expand=true`.

        While a recurring event's dates are being regenerated after a schedule change, which takes a
        few seconds, the agenda can briefly leave out some of that event's dates.

        Requires the `calendar_event_read` permission.
      request:
        name: ListCalendarEventsRequest
        query-parameters:
          expand:
            type: optional<boolean>
            docs: When `true`, returns the agenda view described above. Defaults to `false`.
          after: optional<calendar.WindowAfter>
          before: optional<calendar.WindowBefore>
          include_overlapping: optional<calendar.IncludeOverlapping>
          limit: optional<calendar.CalendarLimit>
          page_token: optional<global.PageToken>
      response: calendar.ListCalendarEventsResponse
      errors:
        - global.ValidationError
        - calendar.ForbiddenError
        - global.NotFoundError
      examples:
        - name:
            "Agenda"
          path-parameters:
            {
              "inbox_id": "scheduler@agentmail.to"
            }
          query-parameters:
            {
              "expand": true,
              "after": "2026-10-07T00:00:00Z",
              "before": "2026-10-16T00:00:00Z",
              "limit": 3
            }
          response:
