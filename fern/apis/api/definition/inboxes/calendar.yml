    respondToEvent:
      method: POST
      path: /events/{event_id}/respond
      display-name: Respond to Event
      docs: |
        Accepts, declines or tentatively accepts an invitation the inbox received by email. Pass the
        event's UUID to respond for every date, or a dated ID to respond for one date only.

        Only works on `email` events where the inbox is an attendee; anything else returns 409
        `calendar_response_invalid`. Updates the inbox's attendee entry and sends
        `calendar.event.responded`. With `send_reply` (default `true`) the inbox emails the response
        to the organizer.

        Requires the `calendar_event_update` permission and the current `ETag` in `If-Match`.
      path-parameters:
        event_id: calendar.CalendarEventId
      request:
        name: RespondCalendarEventRequestWrapper
        headers:
          If-Match:
            type: string
            docs: The event's or date's current `ETag`.
        body:
          extends: calendar.RespondCalendarEventRequest
          properties: {}
      response: calendar.CalendarEventMutationResponse
      errors:
        - global.ValidationError
        - calendar.ForbiddenError
        - global.NotFoundError
        - global.ConflictError
        - calendar.EventExpiredError
        - calendar.PreconditionFailedError
        - calendar.PayloadTooLargeError
        - calendar.PreconditionRequiredError
      examples:
        - path-parameters:
            {
              "inbox_id": "scheduler@agentmail.to",
              "event_id": "a1d5c7e9-2b4f-4c6a-9e8d-3f7b1c5a9d20"
            }
