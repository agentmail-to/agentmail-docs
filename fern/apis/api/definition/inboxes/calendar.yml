    listEventInstances:
      method: GET
      path: /events/{event_id}/instances
      display-name: List Event Instances
      docs: |
        Lists the dates of one recurring event in a time window, in start order, with each date's
        edits applied. Dates are computed from the rule, so this works for any window up to 366
        days, including dates far in the future. Cancelled dates are left out.

        The window defaults to now through 90 days from now. Items omit `description`, `metadata`
        and `attendees`; get a date by its ID for the full object. Requires the
        `calendar_event_read` permission.
      path-parameters:
        event_id:
          type: string
          docs: UUID of the recurring event.
      request:
        name: ListCalendarEventInstancesRequest
        query-parameters:
          after: optional<calendar.WindowAfter>
          before: optional<calendar.WindowBefore>
          include_overlapping: optional<calendar.IncludeOverlapping>
          limit: optional<calendar.CalendarLimit>
          page_token: optional<global.PageToken>
      response: calendar.ListCalendarEventsResponse
      errors:
        - global.ValidationError
        - calendar.ForbiddenError
        - global.NotFoundError
      examples:
