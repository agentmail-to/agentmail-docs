# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  global: ../__package__.yml
  inboxes: __package__.yml
  calendar: ../calendar.yml

service:
  url: Http
  base-path: /inboxes/{inbox_id}/calendar
  path-parameters:
    inbox_id: inboxes.InboxId
  auth: true

  endpoints:
    get:
      availability: beta
      method: GET
      path: ""
      display-name: Get Calendar
      docs: |
        Gets the inbox's calendar. Every inbox has one calendar, so this works before any event is
        created. Its `etag` (also the `ETag` response header) is the value to send in `If-Match` to
        make an update conditional.

        Requires the `calendar_read` permission. Calendar is in private beta: organizations without
        access receive a `403`.
      request:
        name: GetCalendarRequest
        query-parameters:
          consistency: optional<calendar.CalendarConsistency>
      response: calendar.Calendar
      errors:
        - global.ValidationError
        - calendar.ForbiddenError
        - global.NotFoundError
      examples:
        - path-parameters:
            {
              "inbox_id": "scheduler@agentmail.to"
            }
          response:
            {
              "body": {
                "inbox_id": "scheduler@agentmail.to",
                "timezone": "America/New_York",
                "event_count": 2,
                "created_at": "2026-10-01T16:20:00Z",
                "updated_at": "2026-10-01T16:25:00Z",
                "etag": "\"rv-1\""
              }
            }

    update:
      availability: beta
      method: PATCH
      path: ""
      display-name: Update Calendar
      docs: |
        Updates the calendar's default time zone. Existing events keep their own `timezone`; only
        events created later without a `timezone` use the new default.

        Requires the `calendar_update` permission. To make the update conditional, send the
        calendar's current `etag` in `If-Match`: a stale value returns `412`. Without `If-Match` the
        update applies to the calendar as it is.

        Calendar is in private beta: organizations without access receive a `403`.
      request:
        name: UpdateCalendarRequestWrapper
        headers:
          If-Match:
            type: optional<string>
            docs: The calendar's current `etag`, for example `"rv-0"`. Optional; makes the update conditional.
        body:
          extends: calendar.UpdateCalendarRequest
          properties: {}
      response: calendar.Calendar
      errors:
        - global.ValidationError
        - calendar.ForbiddenError
        - global.NotFoundError
        - global.ConflictError
        - calendar.PreconditionFailedError
        - calendar.PayloadTooLargeError
      examples:
        - path-parameters:
            {
              "inbox_id": "scheduler@agentmail.to"
            }
          headers:
            {
              "If-Match": "\"rv-0\""
            }
          request:
            {
              "timezone": "America/New_York"
            }
          response:
            {
              "body": {
                "inbox_id": "scheduler@agentmail.to",
                "timezone": "America/New_York",
                "event_count": 2,
                "created_at": "2026-10-01T16:20:00Z",
                "updated_at": "2026-10-01T16:25:00Z",
                "etag": "\"rv-1\""
              }
            }

    listEvents:
      availability: beta
      method: GET
      path: /events
      display-name: List Events
      docs: |
        Lists the events stored on the calendar: one item per one-off or recurring event, plus one
        item for each edited date of a recurring event (as that dated event, with
        `is_exception: true`). Ordered by most recently updated, and cancelled events are included.
        Use it to sync or manage what you created. To see what is on the calendar in a time window,
        use Get Agenda.

        Requires the `calendar_event_read` permission.

        Calendar is in private beta: organizations without access receive a `403`.
      request:
        name: ListCalendarEventsRequest
        query-parameters:
          limit: optional<calendar.CalendarLimit>
          page_token: optional<global.PageToken>
      response: calendar.ListCalendarEventsResponse
      errors:
        - global.ValidationError
        - calendar.ForbiddenError
        - global.NotFoundError
      examples:
        - path-parameters:
            {
              "inbox_id": "scheduler@agentmail.to"
            }
          query-parameters:
            {
              "limit": 50
            }
          response:
            {
              "body": {
                "count": 2,
                "limit": 50,
                "events": [
                  {
                    "event_id": "3f8a2c1e-6b4d-4e9f-a7c2-5d1b8e0f9a36",
                    "kind": "single",
                    "title": "Intro call with Acme",
                    "description": "Walk Jane through the onboarding plan.",
                    "location": "https://meet.example.com/acme-intro",
                    "metadata": {
                      "crm_deal_id": "D-1042"
                    },
                    "status": "confirmed",
                    "all_day": false,
                    "start": "2026-10-15T14:00:00",
                    "end": "2026-10-15T14:30:00",
                    "timezone": "America/New_York",
                    "duration_mode": "exact",
                    "duration_value": 1800000,
                    "start_at": "2026-10-15T18:00:00Z",
                    "end_at": "2026-10-15T18:30:00Z",
                    "attendees": [
                      {
                        "email": "jane@acme.com",
                        "name": "Jane Doe",
                        "status": "needs_action",
                        "role": "required"
                      }
                    ],
                    "attendee_count": 1,
                    "uid": "3f8a2c1e-6b4d-4e9f-a7c2-5d1b8e0f9a36@agentmail.to",
                    "sequence": 0,
                    "source": "api",
                    "organizer_email": "scheduler@agentmail.to",
                    "resource_revision": 0,
                    "created_at": "2026-10-01T16:30:00Z",
                    "updated_at": "2026-10-01T16:30:00Z"
                  },
                  {
                    "event_id": "7c4e9b2a-1f3d-4a8e-b6c5-2e9d0f1a8b47",
                    "kind": "series",
                    "title": "Team standup",
                    "location": "https://meet.example.com/standup",
                    "status": "confirmed",
                    "all_day": false,
                    "start": "2026-10-05T09:00:00",
                    "end": "2026-10-05T09:15:00",
                    "timezone": "America/New_York",
                    "duration_mode": "nominal",
                    "duration_value": 900000,
                    "start_at": "2026-10-05T13:00:00Z",
                    "end_at": "2026-10-05T13:15:00Z",
                    "recurrence": {
                      "rule": "FREQ=WEEKLY;BYDAY=MO,WE,FR"
                    },
                    "attendees": [],
                    "attendee_count": 0,
                    "uid": "7c4e9b2a-1f3d-4a8e-b6c5-2e9d0f1a8b47@agentmail.to",
                    "sequence": 0,
                    "source": "api",
                    "organizer_email": "scheduler@agentmail.to",
                    "resource_revision": 0,
                    "created_at": "2026-10-01T16:25:00Z",
                    "updated_at": "2026-10-01T16:25:00Z"
                  }
                ]
              }
            }

    getAgenda:
      availability: beta
      method: GET
      path: /agenda
      display-name: Get Agenda
      docs: |
        Lists every date on the calendar in a time window, ordered by start time: one-off events,
        and recurring events expanded into their individual dates, with cancelled dates left out.
        Use it to answer "what is on the calendar".

        The window defaults to now through 90 days from now and can be at most 366 days. Items omit
        `description`, `metadata` and `attendees`; get an event by ID for the full object. Dates of
        recurring events appear only up to about 90 days from now; use List Event Instances for a
        recurring event's later dates. While a recurring event's dates are being regenerated after a
        schedule change, which takes a few seconds, the agenda can briefly leave out some of them.

        Requires the `calendar_event_read` permission.

        Calendar is in private beta: organizations without access receive a `403`.
      request:
        name: GetCalendarAgendaRequest
        query-parameters:
          after: optional<calendar.WindowAfter>
          before: optional<calendar.WindowBefore>
          include_overlapping: optional<calendar.IncludeOverlapping>
          limit: optional<calendar.CalendarLimit>
          page_token: optional<global.PageToken>
      response: calendar.ListCalendarEventsResponse
      errors:
        - global.ValidationError
        - calendar.ForbiddenError
        - global.NotFoundError
      examples:
        - path-parameters:
            {
              "inbox_id": "scheduler@agentmail.to"
            }
          query-parameters:
            {
              "after": "2026-10-07T00:00:00Z",
              "before": "2026-10-16T00:00:00Z",
              "limit": 3
            }
          response:
