              }
            }

    updateEvent:
      method: PATCH
      path: /events/{event_id}
      display-name: Update Event
      docs: |
        Updates an event. Send only the fields to change, with the event's current `ETag` in
        `If-Match`.

        - **One-off or series UUID:** changes the event itself. For a series, the change applies to
          every date that has not been edited individually.
        - **Dated ID (`<uuid>_<slot>`):** changes one date (`mode=single`, the default) or that date
          and every later date (`mode=future`). `all_day`, `timezone` and `recurrence` cannot be sent
          for a dated ID.

        Once a date has started, its start can no longer change, but its end and status can (409
        `event_already_started`). Once it has ended, only `title`, `description`, `location`,
        `metadata` and `attendees` can change. During the few seconds a date is starting, schedule
        changes return 409 `event_starting`; retry shortly.

        Sends `calendar.event.updated`. With `send_invites: true` the organizer inbox also emails the
        updated invitation to every attendee. Requires the `calendar_event_update` permission.
      path-parameters:
        event_id: calendar.CalendarEventId
      request:
        name: UpdateCalendarEventRequestWrapper
        headers:
          If-Match:
            type: string
            docs: The event's or date's current `ETag`, from the latest read or write response.
        query-parameters:
          mode: optional<calendar.InstanceMutationMode>
        body:
          extends: calendar.UpdateCalendarEventRequest
          properties: {}
      response: calendar.CalendarEventMutationResponse
      errors:
        - global.ValidationError
        - calendar.ForbiddenError
        - global.NotFoundError
        - global.ConflictError
        - calendar.EventExpiredError
        - calendar.PreconditionFailedError
        - calendar.PayloadTooLargeError
        - calendar.PreconditionRequiredError
      examples:
        - name:
            "Reschedule a one-off event"
          path-parameters:
