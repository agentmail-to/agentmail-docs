    deleteEvent:
      availability: beta
      method: DELETE
      path: /events/{event_id}
      display-name: Delete Event
      docs: |
        Deletes an event, or cancels dates of a recurring event.

        - **One-off or series UUID:** deletes the event and every date of it. The event disappears
          from reads immediately and is removed in the background; the response is `202` with a
          `deletion_id`. A retry returns the same `deletion_id` while removal runs (send the same
          `Idempotency-Key`, or none both times); once it has finished, the event no longer exists
          and a retry returns `404`. No `calendar.event.starting` or `calendar.event.ending` webhook
          is sent for the event after the delete is accepted.
        - **Dated ID (`<uuid>_<slot>`):** cancels that date (`mode=single`, the default) or that date
          and every later date (`mode=future`). Returns `202` with the cancelled date. A `mode=future`
          delete from the first date deletes the whole series and returns a `deletion_id` instead.
          A date that is already running still gets its `calendar.event.ending`.

        Deleting a one-off or series event sends `calendar.event.deleted`. Cancelling dates sends
        `calendar.event.updated` with the cancelled date. With `send_invites=true` the organizer
        inbox also emails a cancellation to every attendee. Requires the `calendar_event_delete`
        permission. To make the delete conditional, send the current `etag` in `If-Match`.

        Emailing cancellations counts one send per attendee against the organization, pod and inbox
        send limits, charged before the delete; an over-limit request returns `429`
        `rate_limit_exceeded` and deletes nothing.

        Calendar is in private beta: organizations without access receive a `403`.
      path-parameters:
        event_id: calendar.CalendarEventId
      request:
        name: DeleteCalendarEventRequest
        headers:
          If-Match:
            type: optional<string>
            docs: The event's or date's current `etag`. Optional; makes the delete conditional.
          Idempotency-Key:
            type: optional<string>
            docs: |
              1 to 128 visible ASCII characters. Optional. Retrying a delete with the same key
              returns the original result; without a key, retries of the same delete share one
              derived from the event. Keys are unique across your organization: reusing one to
              delete a different event returns `409` `idempotency_conflict`.
        query-parameters:
          mode: optional<calendar.InstanceMutationMode>
          send_invites:
            type: optional<boolean>
            docs: When `true`, emails a cancellation (iCalendar `CANCEL`) to every attendee. Only the organizer can send. Defaults to `false`.
      response:
        status-code: 202
        type: calendar.DeleteCalendarEventResponse
      errors:
        - global.ValidationError
        - calendar.ForbiddenError
        - global.NotFoundError
        - global.ConflictError
        - calendar.EventExpiredError
        - calendar.PreconditionFailedError
        - calendar.RateLimitError
      examples:
        - name:
            "Delete an event"
          path-parameters:
            {
              "inbox_id": "scheduler@agentmail.to",
              "event_id": "3f8a2c1e-6b4d-4e9f-a7c2-5d1b8e0f9a36"
            }
          headers:
            {
              "If-Match": "\"rv-1\"",
              "Idempotency-Key": "delete-intro-acme"
            }
          query-parameters:
            {
              "send_invites": true
            }
          response:
            {
              "body": {
                "deletion_id": "5e2b7d9f-4a1c-4e8b-b3d6-8c0a2f4e6b19"
              }
            }
        - name:
            "Cancel one date of a series"
          path-parameters:
            {
              "inbox_id": "scheduler@agentmail.to",
              "event_id": "7c4e9b2a-1f3d-4a8e-b6c5-2e9d0f1a8b47_t20261007T090000"
            }
          headers:
            {
              "If-Match": "\"occ-0-0-0-none-none\""
            }
          query-parameters:
            {
              "mode": "single"
            }
          response:
            {
              "body": {
                "event": {
                  "event_id": "7c4e9b2a-1f3d-4a8e-b6c5-2e9d0f1a8b47_t20261007T090000",
                  "kind": "instance",
                  "series_id": "7c4e9b2a-1f3d-4a8e-b6c5-2e9d0f1a8b47",
                  "original_start": "2026-10-07T09:00:00",
                  "original_start_at": "2026-10-07T13:00:00Z",
                  "is_exception": false,
                  "title": "Team standup",
                  "location": "https://meet.example.com/standup",
                  "status": "cancelled",
                  "all_day": false,
                  "start": "2026-10-07T09:00:00",
                  "end": "2026-10-07T09:15:00",
                  "timezone": "America/New_York",
                  "duration_mode": "nominal",
                  "duration_value": 900000,
                  "start_at": "2026-10-07T13:00:00Z",
                  "end_at": "2026-10-07T13:15:00Z",
                  "attendee_count": 0,
                  "uid": "7c4e9b2a-1f3d-4a8e-b6c5-2e9d0f1a8b47@agentmail.to",
                  "sequence": 0,
                  "source": "api",
