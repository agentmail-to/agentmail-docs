    createEvent:
      availability: beta
      method: POST
      path: /events
      display-name: Create Event
      docs: |
        Creates a one-off or recurring event on the inbox's calendar. Times are wall-clock values in
        `timezone` (the calendar's default time zone if omitted); the response also gives each
        boundary as a UTC instant in `start_at` and `end_at`.

        `calendar.event.created` is sent once the event is stored, then `calendar.event.starting`
        and `calendar.event.ending` as each date begins and ends. With `send_invites: true` the
        inbox also emails an invitation to every attendee.

        Pass `client_id` to make retries safe: repeating the request with the same `client_id` and
        body returns the original event with status `200` instead of `201`, for as long as the event
        exists.

        With `send_invites: true`, each attendee counts as one send against the organization, pod
        and inbox send limits, charged before the event is stored. An over-limit request returns
        `429` `rate_limit_exceeded` and creates nothing. A replay of an earlier create is not
        charged again.

        The event's `etag` is the value to send in `If-Match` to make a later update or delete
        conditional. Requires the `calendar_event_create` permission.

        Calendar is in private beta: organizations without access receive a `403`.
      request: calendar.CreateCalendarEventRequest
      response:
        status-code: 201
        type: calendar.CalendarEventMutationResponse
      errors:
        - global.ValidationError
        - calendar.ForbiddenError
        - global.NotFoundError
        - global.ConflictError
        - calendar.PayloadTooLargeError
        - calendar.RateLimitError
      examples:
        - name:
            "One-off event with an invitation"
          path-parameters:
            {
              "inbox_id": "scheduler@agentmail.to"
            }
          request:
            {
              "client_id": "intro-acme-2026-10-15",
              "title": "Intro call with Acme",
              "description": "Walk Jane through the onboarding plan.",
              "location": "https://meet.example.com/acme-intro",
              "metadata": {
                "crm_deal_id": "D-1042"
              },
              "start": "2026-10-15T14:00:00",
              "end": "2026-10-15T14:30:00",
              "timezone": "America/New_York",
              "attendees": [
                {
                  "email": "jane@acme.com",
                  "name": "Jane Doe"
                }
              ],
              "send_invites": true
            }
          response:
            {
              "body": {
                "event": {
                  "event_id": "3f8a2c1e-6b4d-4e9f-a7c2-5d1b8e0f9a36",
                  "kind": "single",
                  "title": "Intro call with Acme",
                  "description": "Walk Jane through the onboarding plan.",
                  "location": "https://meet.example.com/acme-intro",
                  "metadata": {
                    "crm_deal_id": "D-1042"
                  },
                  "status": "confirmed",
                  "all_day": false,
                  "start": "2026-10-15T14:00:00",
                  "end": "2026-10-15T14:30:00",
                  "timezone": "America/New_York",
                  "duration_mode": "exact",
                  "duration_value": 1800000,
                  "start_at": "2026-10-15T18:00:00Z",
                  "end_at": "2026-10-15T18:30:00Z",
                  "attendees": [
                    {
                      "email": "jane@acme.com",
                      "name": "Jane Doe",
                      "status": "needs_action",
                      "role": "required"
                    }
                  ],
                  "attendee_count": 1,
                  "uid": "3f8a2c1e-6b4d-4e9f-a7c2-5d1b8e0f9a36@agentmail.to",
                  "sequence": 0,
                  "source": "api",
                  "organizer_email": "scheduler@agentmail.to",
                  "resource_revision": 0,
                  "created_at": "2026-10-01T16:30:00Z",
                  "updated_at": "2026-10-01T16:30:00Z",
                  "etag": "\"rv-0\""
                },
                "operation_id": "0d6f1e2a-9c3b-4d5e-8f7a-6b1c2d3e4f50"
              }
            }
        - name:
            "Recurring event"
          path-parameters:
            {
              "inbox_id": "scheduler@agentmail.to"
            }
          request:
            {
              "title": "Team standup",
              "location": "https://meet.example.com/standup",
              "start": "2026-10-05T09:00:00",
              "end": "2026-10-05T09:15:00",
              "timezone": "America/New_York",
              "recurrence": {
                "rule": "FREQ=WEEKLY;BYDAY=MO,WE,FR"
              }
            }
          response:
            {
              "body": {
                "event": {
                  "event_id": "7c4e9b2a-1f3d-4a8e-b6c5-2e9d0f1a8b47",
                  "kind": "series",
                  "title": "Team standup",
                  "location": "https://meet.example.com/standup",
                  "status": "confirmed",
                  "all_day": false,
                  "start": "2026-10-05T09:00:00",
                  "end": "2026-10-05T09:15:00",
                  "timezone": "America/New_York",
                  "duration_mode": "nominal",
                  "duration_value": 900000,
                  "start_at": "2026-10-05T13:00:00Z",
                  "end_at": "2026-10-05T13:15:00Z",
                  "recurrence": {
                    "rule": "FREQ=WEEKLY;BYDAY=MO,WE,FR"
                  },
                  "attendees": [],
                  "attendee_count": 0,
                  "uid": "7c4e9b2a-1f3d-4a8e-b6c5-2e9d0f1a8b47@agentmail.to",
                  "sequence": 0,
                  "source": "api",
                  "organizer_email": "scheduler@agentmail.to",
                  "resource_revision": 0,
                  "created_at": "2026-10-01T16:25:00Z",
