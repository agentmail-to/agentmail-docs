# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  global: ../../__package__.yml
  inboxes: ../__package__.yml
  webhooks: ../../webhooks/__package__.yml
  polling: ../../webhooks/polling.yml

service:
  url: Http
  base-path: /inboxes/{inbox_id}/webhooks/polling
  path-parameters:
    inbox_id: inboxes.InboxId
  auth: true

  endpoints:
    list:
      method: GET
      path: ""
      display-name: List Polling Webhooks
      docs: |
        Lists the polling webhooks created through this inbox route.

        **CLI:**
        ```bash
        agentmail inboxes webhooks polling list --inbox-id <inbox_id>
        ```
      request:
        name: InboxListPollingWebhooksRequest
        query-parameters:
          limit: optional<global.Limit>
          page_token: optional<global.PageToken>
          ascending: optional<global.Ascending>
      response: polling.ListPollingWebhooksResponse
      errors:
        - global.ValidationError

    get:
      method: GET
      path: /{webhook_id}
      display-name: Get Polling Webhook
      docs: |
        **CLI:**
        ```bash
        agentmail inboxes webhooks polling get --inbox-id <inbox_id> --webhook-id <webhook_id>
        ```
      path-parameters:
        webhook_id: webhooks.WebhookId
      response: polling.PollingWebhook
      errors:
        - global.NotFoundError

    create:
      method: POST
      path: ""
      display-name: Create Polling Webhook
      docs: |
        Create a polling webhook scoped to this inbox and return the `token` that reads it.

        **CLI:**
        ```bash
        agentmail inboxes webhooks polling create --inbox-id <inbox_id> --client-id my-agent --event-types message.received
        ```
      request: polling.CreateInboxPollingWebhookRequest
      response: polling.CreatePollingWebhookResponse
      errors:
        - global.ValidationError
        - global.ConflictError

    delete:
      method: DELETE
      path: /{webhook_id}
      display-name: Delete Polling Webhook
      docs: |
        **CLI:**
        ```bash
        agentmail inboxes webhooks polling delete --inbox-id <inbox_id> --webhook-id <webhook_id>
        ```
      path-parameters:
        webhook_id: webhooks.WebhookId
      errors:
        - global.NotFoundError
