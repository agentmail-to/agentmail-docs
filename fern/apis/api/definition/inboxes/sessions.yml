# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  global: ../__package__.yml
  inboxes: __package__.yml
  sessions: ../sessions.yml
  api-keys: ../api-keys.yml

service:
  url: Http
  base-path: /inboxes/{inbox_id}/sessions
  path-parameters:
    inbox_id: inboxes.InboxId
  auth: true

  endpoints:
    list:
      method: GET
      path: ""
      display-name: List Sessions
      docs: |
        List the inbox's active sessions. The same rows as
        [List Sessions](/api-reference/sessions/list), limited to one inbox.
        Requires `api_key_read`.
      request:
        name: ListInboxSessionsRequest
        query-parameters:
          limit: optional<api-keys.BrowserAuthorizationListLimit>
          page_token: optional<global.PageToken>
      response: sessions.ListSessionsResponse
      errors:
        - global.NotFoundError

    get:
      method: GET
      path: /{session_id}
      display-name: Get Session
      docs: |
        Get one of the inbox's sessions by ID, pending or active. A session
        that belongs to another inbox returns `404`. Otherwise identical to
        [Get Session](/api-reference/sessions/get). Requires `api_key_read`.
      path-parameters:
        session_id: sessions.SessionId
      response: sessions.Session
      errors:
        - global.NotFoundError

    delete:
      method: DELETE
      path: /{session_id}
      display-name: Delete Session
      docs: |
        Delete one of the inbox's sessions. A pending session is cancelled and
        its magic URL can no longer be used; an active session is revoked and
        can no longer authenticate. Requires `api_key_delete`.
      path-parameters:
        session_id: sessions.SessionId
      response:
        status-code: 204
      errors:
        - global.NotFoundError
