# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

navigation:
  - threads.yml
  - messages.yml
  - drafts.yml
  - webhooks.yml
  - lists.yml
  - metrics.yml
  - events.yml
  - api-keys.yml

imports:
  global: ../__package__.yml
  pods: ../pods/__package__.yml
  api-keys: ../api-keys.yml

types:
  InboxId:
    type: string
    docs: The ID of the inbox.

  Email:
    type: string
    docs: Email address of the inbox.

  DisplayName:
    type: string
    docs: "Display name: `Display Name <username@domain.com>`."

  ClientId:
    type: string
    docs: Client ID of inbox.

  MetadataValue:
    discriminated: false
    union:
      - string
      - double
      - boolean
    docs: A metadata value. May be a string, number, or boolean.

  Metadata:
    type: map<string, MetadataValue>
    docs: |
      Custom key-value pairs attached to the inbox. Up to 256 keys. Keys and
      string values are each limited to 256 characters. When updating metadata,
      send a key with a null value to remove that key.

  UpdateMetadata:
    type: map<string, nullable<MetadataValue>>
    docs: |
      Custom key-value pairs to merge into the inbox's existing metadata. A
      value may be a string, number, boolean, or null. Setting a key to null
      removes it. Up to 256 keys; keys and string values are each limited to
      256 characters.

  Inbox:
    properties:
      pod_id: pods.PodId
      inbox_id: InboxId
      email: Email
      display_name: optional<DisplayName>
      client_id: optional<ClientId>
      metadata:
        type: optional<Metadata>
        docs: Custom metadata attached to the inbox.
      updated_at:
        type: datetime
        docs: Time at which inbox was last updated.
      created_at:
        type: datetime
        docs: Time at which inbox was created.

  ListInboxesResponse:
    properties:
      count: global.Count
      limit: optional<global.Limit>
      next_page_token: optional<global.PageToken>
      inboxes:
        type: list<Inbox>
        docs: Ordered by `created_at` descending.

  SearchInboxesResponse:
    properties:
      count: global.Count
      limit: optional<global.Limit>
      next_page_token: optional<global.PageToken>
      inboxes:
        type: list<Inbox>
        docs: Ordered by relevance, best match first.

  CreateInboxRequest:
    properties:
      username:
        type: optional<string>
        docs: Username of address. Randomly generated if not specified.
      domain:
        type: optional<string>
        docs: |
          Domain of address. Must be a verified domain, or any subdomain of a
          verified domain that has subdomains enabled (e.g., `bot.example.com`).
          Defaults to `agentmail.to`.
      display_name: optional<DisplayName>
      client_id: optional<ClientId>
      metadata:
        type: optional<Metadata>
        docs: Custom metadata to attach to the inbox.

  UpdateInboxRequest:
    properties:
      display_name: optional<DisplayName>
      metadata:
        type: optional<nullable<UpdateMetadata>>
        docs: |
          Metadata to merge into the inbox's existing metadata. Keys you include
          are added or overwritten; keys you omit are left unchanged. To remove a
          single key, send it with a null value. To clear all metadata, send
          `metadata` as null. Sending an empty object is rejected; use null to
          clear. Each update must include at least one of `display_name` or
          `metadata`.

  AuthorizeInboxRequest:
    docs: |
      Authorize one pending AgentID sign-in for the inbox in the path. The
      inbox is selected by the trusted path parameter, never by an AgentID
      `login_hint`.
    properties:
      transaction_jti: api-keys.BrowserEnrollmentTransactionJti
      authorize:
        type: optional<boolean>
        docs: |
          Approve the transaction's relying party on the agent's behalf so no
          human has to click through the disclosure page. Requires the API
          key permission for every owner scope involved.

service:
  url: Http
  base-path: /inboxes
  auth: true

  endpoints:
    list:
      method: GET
      path: ""
      display-name: List Inboxes
      docs: |
        **CLI:**
        ```bash
        agentmail inboxes list
        ```
      request:
        name: ListInboxesRequest
        query-parameters:
          limit: optional<global.Limit>
          page_token: optional<global.PageToken>
          ascending: optional<global.Ascending>
      response: ListInboxesResponse

    search:
      method: GET
      path: /search
      display-name: Search Inboxes
      docs: |
        Searches inboxes in the organization by address or display name, ranked
        by relevance. Each word in the query matches the start of a word in the
        address or display name, so `sup` matches `support@example.com` but
        `port` does not. An exact address match always ranks first. `limit`
        cannot exceed 100. A page can be empty and still carry a
        `next_page_token`; keep paging until the token is absent.
      request:
        name: SearchInboxesRequest
        query-parameters:
          q:
            type: string
            docs: Address or display name to search for. Matches word prefixes. Must be 2 to 256 characters.
          limit: optional<global.Limit>
          page_token: optional<global.PageToken>
      response: SearchInboxesResponse
      errors:
        - global.ValidationError

    get:
      method: GET
      path: /{inbox_id}
      display-name: Get Inbox
      docs: |
        **CLI:**
        ```bash
        agentmail inboxes get --inbox-id <inbox_id>
        ```
      path-parameters:
        inbox_id: InboxId
      response: Inbox
      errors:
        - global.NotFoundError

    create:
      method: POST
      path: ""
      display-name: Create Inbox
      docs: |
        **CLI:**
        ```bash
        agentmail inboxes create --display-name "My Agent" --username myagent --domain agentmail.to
        ```
      request: optional<CreateInboxRequest>
      response: Inbox
      errors:
        - global.ValidationError
        - global.UnprocessableError

    update:
      method: PATCH
      path: /{inbox_id}
      display-name: Update Inbox
      docs: |
        **CLI:**
        ```bash
        agentmail inboxes update --inbox-id <inbox_id> --display-name "Updated Name"
        ```
      path-parameters:
        inbox_id: InboxId
      request:
        body:
          type: UpdateInboxRequest
          docs: Expects an object; provide at least one of `display_name` or `metadata`.
      response: Inbox
      errors:
        - global.NotFoundError
        - global.ValidationError

    delete:
      method: DELETE
      path: /{inbox_id}
      display-name: Delete Inbox
      docs: |
        **CLI:**
        ```bash
        agentmail inboxes delete --inbox-id <inbox_id>
        ```
      path-parameters:
        inbox_id: InboxId
      errors:
        - global.NotFoundError

    authorize:
      method: POST
      path: /{inbox_id}/authorize
      display-name: Authorize Inbox
      docs: |
        Authorize the AgentID sign-in a browser is already waiting in, for the
        inbox in the path. Mints the browser API key that sign-in will activate
        and returns it as `pending`; poll
        [Get API Key](/api-reference/api-keys/get) for `status`. The
        transaction is the idempotency anchor: a repeat for the same
        transaction, inbox, and bearer returns the same pending key. Requires
        `provider_connect`. Read `transaction_jti` only from an action
        published on exactly `https://auth.agentid.com`.
      path-parameters:
        inbox_id: InboxId
      request: AuthorizeInboxRequest
      response:
        status-code: 202
        type: api-keys.BrowserApiKey
      errors:
        - global.ValidationError
        - global.NotFoundError
