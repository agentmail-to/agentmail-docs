# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  global: ../__package__.yml
  pods: __package__.yml
  inboxes: ../inboxes/__package__.yml

service:
  url: Http
  base-path: /pods/{pod_id}/inboxes
  path-parameters:
    pod_id: pods.PodId
  auth: true

  endpoints:
    list:
      method: GET
      path: ""
      display-name: List Inboxes
      docs: |
        **CLI:**
        ```bash
        agentmail pods inboxes list --pod-id <pod_id>
        ```
      request:
        name: ListInboxesRequest
        query-parameters:
          limit: optional<global.Limit>
          page_token: optional<global.PageToken>
          ascending: optional<global.Ascending>
      response: inboxes.ListInboxesResponse
      errors:
        - global.NotFoundError

    search:
      method: GET
      path: /search
      display-name: Search Inboxes
      docs: |
        Searches inboxes in the pod by address or display name, ranked by
        relevance. Each word in the query matches the start of a word in the
        address or display name, so `sup` matches `support@example.com` but
        `port` does not. An exact address match always ranks first. `limit`
        cannot exceed 100. A page can be empty and still carry a
        `next_page_token`; keep paging until the token is absent.
      request:
        name: SearchInboxesRequest
        query-parameters:
          q:
            type: string
            docs: Address or display name to search for. Matches word prefixes. Must be 2 to 256 characters.
          limit: optional<global.Limit>
          page_token: optional<global.PageToken>
      response: inboxes.SearchInboxesResponse
      errors:
        - global.ValidationError
        - global.NotFoundError

    get:
      method: GET
      path: /{inbox_id}
      display-name: Get Inbox
      docs: |
        **CLI:**
        ```bash
        agentmail pods inboxes get --pod-id <pod_id> --inbox-id <inbox_id>
        ```
      path-parameters:
        inbox_id: inboxes.InboxId
      response: inboxes.Inbox
      errors:
        - global.NotFoundError

    create:
      method: POST
      path: ""
      display-name: Create Inbox
      docs: |
        **CLI:**
        ```bash
        agentmail pods inboxes create --pod-id <pod_id> --username myagent --domain example.com
        ```
      request: inboxes.CreateInboxRequest
      response: inboxes.Inbox
      errors:
        - global.ValidationError
        - global.UnprocessableError

    update:
      method: PATCH
      path: /{inbox_id}
      display-name: Update Inbox
      docs: |
        **CLI:**
        ```bash
        agentmail pods inboxes update --pod-id <pod_id> --inbox-id <inbox_id>
        ```
      path-parameters:
        inbox_id: inboxes.InboxId
      request: inboxes.UpdateInboxRequest
      response: inboxes.Inbox
      errors:
        - global.NotFoundError

    delete:
      method: DELETE
      path: /{inbox_id}
      display-name: Delete Inbox
      docs: |
        **CLI:**
        ```bash
        agentmail pods inboxes delete --pod-id <pod_id> --inbox-id <inbox_id>
        ```
      path-parameters:
        inbox_id: inboxes.InboxId
      errors:
        - global.NotFoundError
