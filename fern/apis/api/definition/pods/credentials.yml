# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  global: ../__package__.yml
  pods: __package__.yml
  credentials: ../credentials.yml

service:
  url: Http
  base-path: /pods/{pod_id}/credentials
  path-parameters:
    pod_id: pods.PodId
  auth: true

  endpoints:
    list:
      method: GET
      path: ""
      display-name: List Pod Credentials
      request:
        name: ListPodCredentialsRequest
        query-parameters:
          limit: optional<global.Limit>
          page_token: optional<global.PageToken>
          ascending: optional<boolean>
          origin: optional<string>
          rp_id: optional<string>
          site: optional<string>
          name: optional<string>
      response: credentials.ListCredentialsResponse
      errors:
        - global.ValidationError
        - credentials.CredentialForbiddenError
        - global.NotFoundError

    create:
      method: POST
      path: ""
      display-name: Create Pod Credential
      request: credentials.CreateCredentialRequest
      response: credentials.Credential
      errors:
        - global.ValidationError
        - credentials.CredentialForbiddenError
        - global.NotFoundError
        - global.ConflictError

    register:
      method: POST
      path: /register
      display-name: Register Pod Passkey
      request: credentials.RegisterPasskeyRequest
      response: credentials.RegisterPasskeyResponse
      errors:
        - global.ValidationError
        - credentials.CredentialForbiddenError
        - global.NotFoundError
        - global.ConflictError

    assert:
      method: POST
      path: /assert
      display-name: Sign In With Pod Passkey
      request: credentials.AssertCredentialRequest
      response: credentials.AssertCredentialResponse
      errors:
        - global.ValidationError
        - credentials.CredentialForbiddenError
        - global.NotFoundError
        - global.ConflictError

    get:
      method: GET
      path: /{credential_id}
      display-name: Get Pod Credential
      path-parameters:
        credential_id: credentials.CredentialId
      response: credentials.Credential
      errors:
        - credentials.CredentialForbiddenError
        - global.NotFoundError

    update:
      method: PATCH
      path: /{credential_id}
      display-name: Update Pod Credential
      path-parameters:
        credential_id: credentials.CredentialId
      request: credentials.UpdateCredentialRequest
      response: credentials.Credential
      errors:
        - global.ValidationError
        - credentials.CredentialForbiddenError
        - global.NotFoundError
        - global.ConflictError

    rotate:
      method: POST
      path: /{credential_id}/rotate
      display-name: Rotate Pod Credential
      path-parameters:
        credential_id: credentials.CredentialId
      request: credentials.RotateCredentialRequest
      response: credentials.Credential
      errors:
        - global.ValidationError
        - credentials.CredentialForbiddenError
        - global.NotFoundError
        - global.ConflictError

    delete:
      method: DELETE
      path: /{credential_id}
      display-name: Delete Pod Credential
      path-parameters:
        credential_id: credentials.CredentialId
      errors:
        - credentials.CredentialForbiddenError
        - global.NotFoundError

    retrieve:
      method: POST
      path: /{credential_id}/retrieve
      display-name: Retrieve Pod Credential
      path-parameters:
        credential_id: credentials.CredentialId
      request: credentials.RetrieveCredentialRequest
      response: credentials.RetrieveCredentialResponse
      errors:
        - global.ValidationError
        - credentials.CredentialForbiddenError
        - global.NotFoundError
        - global.ConflictError

    sign:
      method: POST
      path: /{credential_id}/sign
      display-name: Sign With Pod Credential
      path-parameters:
        credential_id: credentials.CredentialId
      request: credentials.SignCredentialRequest
      response: credentials.SignCredentialResponse
      errors:
        - global.ValidationError
        - credentials.CredentialForbiddenError
        - global.NotFoundError
        - global.ConflictError
