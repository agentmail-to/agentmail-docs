# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  global: __package__.yml
  inboxes: inboxes/__package__.yml

types:
  # ----------------------------------------------------------------------------------------------
  # Shared scalars
  # ----------------------------------------------------------------------------------------------

  CalendarEventId:
    type: string
    docs: |
      ID of a calendar event. A one-off or recurring event is addressed by its UUID. One date of a
      recurring event is addressed by a dated ID, `<uuid>_<slot>`: `<uuid>_t20261015T090000` for a
      timed date (the original wall-clock start in the event's time zone) or `<uuid>_d20261015` for an
      all-day date. Dated IDs are stable: moving a date keeps its original ID.

  CalendarEventKind:
    enum:
      - single
      - series
      - instance
    docs: |
      What the event object represents.

      - `single`: a one-off event, addressed by its UUID.
      - `series`: the definition of a recurring event, addressed by its UUID. It carries
        `recurrence`; `start` and `end` describe its first date.
      - `instance`: one date of a recurring event, addressed by its dated ID. It carries `series_id`,
        `original_start` and `is_exception`.

  CalendarEventStatus:
    enum:
      - confirmed
      - tentative
      - cancelled
    docs: |
      Status of the event. A `cancelled` event or date stays readable but sends no
      `calendar.event.starting` or `calendar.event.ending` webhooks (cancelling a date that is
      already running still sends its `calendar.event.ending`).

  CalendarEventSource:
    enum:
      - api
      - email
    docs: |
      Where the event came from. `api` events were created through this API and the inbox is their
      organizer. `email` events were created from a calendar invitation (iMIP) received by the inbox;
      their organizer is the sender of the invitation.

  DurationMode:
    enum:
      - nominal
      - exact
    docs: |
      How the event's length is kept when a date crosses a daylight-saving change.

      - `exact`: the event lasts the same elapsed time. Default for one-off timed events.
      - `nominal`: the event keeps its wall-clock end time (a 09:00 to 10:00 meeting stays 09:00 to
        10:00 local time). Default for recurring timed events.

      All-day events are always `nominal`.

  WallTime:
    type: string
    docs: |
      A local wall-clock time without an offset, interpreted in the event's `timezone`.
      Timed events use `YYYY-MM-DDTHH:mm:ss` (for example `2026-10-15T09:00:00`). All-day events use
      `YYYY-MM-DD`. Years must be between 1900 and 9999.

  IanaTimezone:
    type: string
    docs: |
      Canonical IANA time zone name, for example `America/New_York`, `Europe/London` or `UTC`.
      Abbreviations such as `PST`, Windows names such as `Pacific Standard Time`, and spellings that
      differ from the canonical name are rejected.

  ResourceRevision:
    type: integer
    docs: |
      Revision of the resource. It increases on every change. The `ETag` response header carries it
      as `"rv-<resource_revision>"`; send that value back in `If-Match` to update or delete.

  OperationId:
    type: string
    docs: |
      ID of the change this request made. The `calendar.event.created`, `calendar.event.updated`,
      `calendar.event.deleted` or `calendar.event.responded` webhook for the change carries the same
      value as its `event_id`, so you can match webhooks to your own requests.

  DeletionId:
    type: string
    docs: ID of an accepted deletion. Retrying the same delete with the same `Idempotency-Key` returns it again.

  CalendarConsistency:
    enum:
      - eventual
      - primary
    docs: |
      Read consistency. `eventual` (default) reads from the region that serves your request and may
      lag a write made moments earlier by up to a few seconds. `primary` reads from the primary region
      and always reflects every completed write.

  CalendarLimit:
    type: integer
    docs: Maximum number of events to return, from 1 to 100. Defaults to 50.

  WindowAfter:
    type: datetime
    docs: |
      Start of the window (UTC). Defaults to now. The window between `after` and `before` can be at
      most 366 days.

  WindowBefore:
    type: datetime
    docs: |
      End of the window (UTC). Defaults to 90 days after `after`. The window between `after` and
      `before` can be at most 366 days.

  IncludeOverlapping:
    type: boolean
    docs: |
      When `true` (default), include events that started before `after` but are still running at
      `after`. When `false`, include only events that start inside the window.

  InstanceMutationMode:
    enum:
      - single
      - future
    docs: |
      Which dates a change to a dated event applies to. `single` (default) changes only this date.
      `future` changes this date and every later date of the series. Applies only to dated event IDs;
      sending `mode` with a one-off or series UUID is a `400`.

  # ----------------------------------------------------------------------------------------------
  # Calendar
  # ----------------------------------------------------------------------------------------------

  Calendar:
    docs: |
      An inbox's calendar. Every inbox has exactly one calendar; it exists from the moment the inbox
      does and is deleted with it.
    properties:
      inbox_id: inboxes.InboxId
      timezone:
        type: IanaTimezone
        docs: |
          Default time zone for events created without a `timezone`. Defaults to `UTC`. Changing it
          does not move existing events.
      event_count:
        type: integer
        docs: Number of one-off and recurring events on the calendar. Each recurring event counts once.
      created_at:
        type: datetime
        docs: Time at which the calendar was created. The calendar exists from the moment the inbox does, so this is the inbox's creation time.
      updated_at:
        type: datetime
        docs: Time at which the calendar was last updated.

  UpdateCalendarRequest:
    properties:
      timezone:
        type: IanaTimezone
        docs: New default time zone for events created without a `timezone`.

  # ----------------------------------------------------------------------------------------------
  # Attendees and recurrence
  # ----------------------------------------------------------------------------------------------

  AttendeeStatus:
    enum:
      - needs_action
      - accepted
      - declined
      - tentative
    docs: The attendee's response to the invitation.

  AttendeeRole:
    enum:
      - required
      - optional
    docs: Whether the attendee's presence is required.

  Attendee:
    properties:
      email:
        type: string
        docs: Email address of the attendee. Stored in lowercase. Must be unique within the event.
      name:
        type: optional<string>
        docs: Display name of the attendee. At most 256 characters.
      status:
        type: optional<AttendeeStatus>
        docs: Response status. Defaults to `needs_action`.
      role:
        type: optional<AttendeeRole>
        docs: Defaults to `required`.
      comment:
        type: optional<string>
        docs: Comment the attendee sent with their response. At most 4,096 bytes.
      responded_at:
        type: optional<datetime>
        docs: Time at which the attendee last responded.

  RecurrencePeriod:
    docs: An extra date (RDATE) given as a period. Specify exactly one of `end` or `duration`.
    properties:
      start: WallTime
      end: optional<WallTime>
      duration:
        type: optional<string>
        docs: ISO 8601 duration, for example `PT30M`.

  RecurrenceDate:
    discriminated: false
    docs: A wall-clock date or date-time, or (timed events only) a period.
    union:
      - WallTime
      - RecurrencePeriod

  RecurrenceInput:
    docs: |
      Repeats the event. `rule` is an RFC 5545 RRULE, evaluated in the event's `timezone` from the
      event's `start`. Each date keeps its wall-clock time across daylight-saving changes.
    properties:
      rule:
        type: string
        docs: |
          RFC 5545 RRULE body, with or without the `RRULE:` prefix, for example
          `FREQ=WEEKLY;BYDAY=MO,WE,FR` or `FREQ=MONTHLY;BYDAY=-1FR;COUNT=12`. Supported parts: `FREQ`,
          `INTERVAL` (1 to 366), `COUNT` (1 to 10,000), `UNTIL` (`YYYYMMDD` or `YYYYMMDDTHHMMSSZ`),
          `WKST`, `BYMONTH`, `BYWEEKNO`, `BYYEARDAY`, `BYMONTHDAY`, `BYDAY`, `BYHOUR`, `BYMINUTE`,
          `BYSECOND` and `BYSETPOS`. `COUNT` and `UNTIL` are mutually exclusive. The rule is stored in
          a normalized form, so a response can differ textually from what you sent. At most 512
          characters after normalization.
      exdates:
        type: optional<list<WallTime>>
        docs: |
          Dates to skip, matching the original start of a date: `YYYY-MM-DDTHH:mm:ss` for timed events,
          `YYYY-MM-DD` for all-day events. At most 366.
      rdates:
        type: optional<list<RecurrenceDate>>
        docs: |
          Extra dates to add. Timed events take date-times or periods; all-day events take dates. At
          most 100.

  Recurrence:
    docs: The recurrence of a series, as stored.
    properties:
      rule:
        type: string
        docs: Normalized RRULE body, without the `RRULE:` prefix.
      exdates: optional<list<WallTime>>
      rdates: optional<list<RecurrenceDate>>
      truncate_before:
        type: optional<WallTime>
        docs: |
          Set when the series was ended with a `mode=future` delete: no date starting at or after
          this wall-clock time occurs.

  # ----------------------------------------------------------------------------------------------
  # Events
  # ----------------------------------------------------------------------------------------------

  CalendarEvent:
    docs: |
      A calendar event. The same shape is used by every response, list item and webhook. `kind` says
      whether it is a one-off event, the definition of a recurring series, or one date of a series.
    properties:
      event_id: CalendarEventId
      kind: CalendarEventKind
      series_id:
        type: optional<string>
        docs: For `instance` events, the UUID of the series this date belongs to.
      original_start:
        type: optional<WallTime>
        docs: For `instance` events, the date's start as the series rule generated it, before any edit.
      original_start_at:
        type: optional<datetime>
        docs: For `instance` events, `original_start` as a UTC instant.
      is_exception:
        type: optional<boolean>
        docs: For `instance` events, `true` when this date was edited or moved, individually or by a `mode=future` change.
      title:
        type: string
        docs: Title of the event.
      description:
        type: optional<string>
        docs: Description of the event. Omitted from expanded list items.
      location:
        type: optional<string>
        docs: Location of the event.
      metadata:
        type: optional<unknown>
        docs: Your own JSON value for the event, usually an object. Never sent to attendees. Omitted from expanded list items.
      status: CalendarEventStatus
      all_day:
        type: boolean
        docs: Whether this is an all-day event.
      start:
        type: WallTime
        docs: Local start time in `timezone`. For all-day events, the first day.
      end:
        type: WallTime
        docs: Local end time in `timezone`. For all-day events, the last day (inclusive).
      timezone: IanaTimezone
      duration_mode: DurationMode
      duration_value:
        type: integer
        docs: Length of the event, in milliseconds for timed events and in days for all-day events.
      start_at:
        type: datetime
        docs: Start as a UTC instant. This is when `calendar.event.starting` is due.
      end_at:
        type: datetime
        docs: End as a UTC instant. This is when `calendar.event.ending` is due.
      recurrence:
        type: optional<Recurrence>
        docs: For `series` events, the recurrence.
      attendees:
        type: optional<list<Attendee>>
        docs: Attendees of the event. Omitted from expanded list items; `attendee_count` is always present.
      attendee_count:
        type: integer
        docs: Number of attendees.
      uid:
        type: string
        docs: iCalendar UID of the event. Invitations about this event carry the same UID.
      sequence:
        type: integer
        docs: |
          iCalendar SEQUENCE number. It increases when a change affects what attendees see (time,
          status, title, description, location, recurrence or attendees).
      source: CalendarEventSource
      organizer_email:
        type: optional<string>
        docs: Email address of the organizer. For `api` events, the inbox.
      origin_message_id:
        type: optional<string>
        docs: For `email` events, the ID of the message whose invitation last created or updated the event.
      resource_revision:
        type: optional<ResourceRevision>
        docs: Present on `single` and `series` events. Dated events use an opaque `ETag` instead.
      created_at:
        type: datetime
        docs: Time at which the event (or, for a date, the definition governing it) was created.
      updated_at:
        type: datetime
        docs: Time at which the event (or, for a date, the definition governing it) was last updated.

  CalendarEventMutationResponse:
    properties:
      event: CalendarEvent
      operation_id: OperationId

  DeleteCalendarEventResponse:
    docs: |
      Deleting a one-off or recurring event (or a `mode=future` delete that covers a whole series)
      returns `deletion_id`. Deleting dates of a series returns the cancelled date as `event` with an
      `operation_id`.
    properties:
      deletion_id: optional<DeletionId>
      event: optional<CalendarEvent>
      operation_id: optional<OperationId>

  ListCalendarEventsResponse:
    properties:
      count: global.Count
      limit: global.Limit
      next_page_token: optional<global.PageToken>
      events:
        type: list<CalendarEvent>
        docs: |
          Without `expand`, ordered by `updated_at` descending. With `expand=true` and on the
          instances endpoint, ordered by `start_at` ascending.

  CreateCalendarEventRequest:
    properties:
      client_id:
        type: optional<string>
        docs: |
          Your idempotency key for this create. Retrying with the same `client_id` and the same body
          returns the original event with `200` instead of creating a second one. Reusing it with a
          different body is a `409` `idempotency_conflict`.
      title:
        type: string
        docs: Title of the event. 1 to 1,000 characters.
      description:
        type: optional<string>
        docs: Description of the event. At most 65,536 bytes.
      location:
        type: optional<string>
        docs: Location of the event. At most 1,024 characters.
      metadata:
        type: optional<unknown>
        docs: Your own JSON value (usually an object), returned on every read and in webhooks. Never sent to attendees. At most 16,384 bytes serialized.
      status:
        type: optional<CalendarEventStatus>
        docs: Defaults to `confirmed`.
      all_day:
        type: optional<boolean>
        docs: Set to `true` for an all-day event. Defaults to `false`.
      start:
        type: WallTime
        docs: |
          Local start time in `timezone`: `YYYY-MM-DDTHH:mm:ss` for timed events, `YYYY-MM-DD` for
          all-day events. For a recurring event, this is the first date.
      end:
        type: WallTime
        docs: |
          Local end time in `timezone`, in the same format as `start`. For timed events it must be
          after `start`; for all-day events it is the last day (inclusive) and can equal `start`.
          One-off events can last up to 366 days; each date of a recurring event up to 31 days.
      timezone:
        type: optional<IanaTimezone>
        docs: Time zone of `start` and `end`. Defaults to the calendar's `timezone`.
      duration_mode:
        type: optional<DurationMode>
        docs: Timed events only. Defaults to `exact` for one-off events and `nominal` for recurring events.
      recurrence:
        type: optional<RecurrenceInput>
        docs: Makes this a recurring event.
      attendees:
        type: optional<list<Attendee>>
        docs: Attendees of the event. At most 100.
      send_invites:
        type: optional<boolean>
        docs: |
          When `true`, the inbox emails an invitation (iCalendar `REQUEST`) to every attendee. Defaults
          to `false`.

  UpdateCalendarEventRequest:
    docs: |
      Send only the fields to change. Fields set to `null` are cleared. At least one field is required.
      `all_day`, `timezone` and `recurrence` can only be changed on a one-off or series UUID, not on a
      dated event ID.
    properties:
      title: optional<string>
      description:
        type: optional<nullable<string>>
        docs: Set to `null` to clear.
      location:
        type: optional<nullable<string>>
        docs: Set to `null` to clear.
      metadata:
        type: optional<nullable<unknown>>
        docs: Replaces the metadata (any JSON value, usually an object). Set to `null` to clear.
      status: optional<CalendarEventStatus>
      all_day:
        type: optional<boolean>
        docs: Changing `all_day` requires `start`, `end` and `timezone` in the same request. Not accepted for dated event IDs.
      start:
        type: optional<WallTime>
        docs: New start. For a one-off or series UUID, send it together with `end`. Not accepted with `mode=future`.
      end:
        type: optional<WallTime>
        docs: New end. For a one-off or series UUID, send it together with `start`. A dated ID accepts `end` alone.
      timezone:
        type: optional<IanaTimezone>
        docs: New time zone. Not accepted for dated event IDs.
      duration_mode: optional<DurationMode>
      recurrence:
        type: optional<nullable<RecurrenceInput>>
        docs: |
          Replaces the recurrence. Set to `null` to turn a series into a one-off event (only when no
          date of it has been edited). Not accepted for dated event IDs.
      attendees:
        type: optional<list<Attendee>>
        docs: Replaces the attendee list.
      send_invites:
        type: optional<boolean>
        docs: |
          When `true`, emails the updated invitation to every attendee. Only the organizer (an `api`
          event) can send. Defaults to `false`.

  RespondStatus:
    enum:
      - accepted
      - declined
      - tentative
    docs: Your response to the invitation.

  RespondCalendarEventRequest:
    properties:
      status: RespondStatus
      comment:
        type: optional<string>
        docs: |
          Comment to include with the response. At most 4,096 characters. It is stored as the inbox's
          attendee `comment`, which updates limit to 4,096 UTF-8 bytes, so keep it within 4,096 bytes
          if you will send the attendee list back in an update.
      send_reply:
        type: optional<boolean>
        docs: When `true` (default), emails the response (iCalendar `REPLY`) to the organizer.

  # ----------------------------------------------------------------------------------------------
  # Errors
  # ----------------------------------------------------------------------------------------------

  PreconditionFailedErrorResponse:
    properties:
      name: global.ErrorName
      code: optional<global.ErrorCode>
      message: global.ErrorMessage
      current_revision:
        type: optional<integer>
        docs: The resource's current revision.
      fix: optional<global.ErrorFix>
      docs: optional<global.ErrorDocs>

errors:
  ForbiddenError:
    status-code: 403
    type: global.ErrorResponse
    docs: |
      The organization does not have calendar access (calendar is in private beta), or the API key
      lacks the required calendar permission.

  EventExpiredError:
    status-code: 410
    type: global.ErrorResponse
    docs: The event's date is outside the retained history window and can no longer be read or changed.

  PreconditionFailedError:
    status-code: 412
    type: PreconditionFailedErrorResponse
    docs: The resource changed since the `If-Match` value was read. Fetch it again, reapply the change, and retry with the new `ETag`.

  PayloadTooLargeError:
    status-code: 413
    type: global.ErrorResponse
    docs: The request body is too large (8 KB for calendar settings, 128 KB for events).

  PreconditionRequiredError:
    status-code: 428
    type: global.ErrorResponse
    docs: The request needs an `If-Match` header. Copy the `ETag` from the latest read of the resource.
