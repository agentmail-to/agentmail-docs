# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  global: __package__.yml
  inboxes: inboxes/__package__.yml

types:
  # Mirrors EventType in events.yml (the API validates both against the same
  # EventTypeSchema) — keep the two lists in sync.
  MetricEventType:
    enum:
      - name: MESSAGE_RECEIVED
        value: message.received
      - name: MESSAGE_RECEIVED_SPAM
        value: message.received.spam
      - name: MESSAGE_RECEIVED_BLOCKED
        value: message.received.blocked
      - name: MESSAGE_RECEIVED_UNAUTHENTICATED
        value: message.received.unauthenticated
      - name: MESSAGE_SENT
        value: message.sent
      - name: MESSAGE_DELIVERED
        value: message.delivered
      - name: MESSAGE_BOUNCED
        value: message.bounced
      - name: MESSAGE_COMPLAINED
        value: message.complained
      - name: MESSAGE_REJECTED
        value: message.rejected
      - name: DOMAIN_VERIFIED
        value: domain.verified
    docs: Type of metric event.

  MetricEventTypes:
    type: list<MetricEventType>
    docs: List of metric event types to query.

  Start:
    type: datetime
    docs: Start timestamp for the query.

  End:
    type: datetime
    docs: End timestamp for the query.

  Period:
    type: integer
    docs: Size of each time bucket as a whole number of seconds, between 1 and 86400.

  MetricLimit:
    type: integer
    docs: Limit on number of buckets to return.

  Descending:
    type: boolean
    docs: Sort in descending order.

  MetricBucket:
    properties:
      timestamp:
        type: datetime
        docs: Timestamp of the bucket.
      count:
        type: integer
        docs: Count of events in the bucket.

  QueryMetricsResponse:
    type: map<MetricEventType, list<MetricBucket>>
    docs: Metrics grouped by event type.

  UsageType:
    enum:
      - name: STORAGE_BYTES
        value: storage_bytes
      - name: MESSAGE_COUNT
        value: message_count
      - name: THREAD_COUNT
        value: thread_count
      - name: INBOX_COUNT
        value: inbox_count
      - name: POD_COUNT
        value: pod_count
      - name: DOMAIN_COUNT
        value: domain_count
    docs: |
      Type of usage metric. Inbox-scoped queries carry `storage_bytes`,
      `message_count`, and `thread_count`; pod-scoped queries add `inbox_count`
      and `domain_count`; organization-scoped queries add `pod_count`.

  UsageTypes:
    type: list<UsageType>
    docs: List of usage metric types to query. Omit to query every type valid for the scope.

  UsagePoint:
    properties:
      timestamp:
        type: datetime
        docs: Timestamp of the point.
      value:
        type: long
        docs: Cumulative value of the usage metric at the timestamp.

  QueryUsageResponse:
    type: map<UsageType, list<UsagePoint>>
    docs: Cumulative usage series grouped by usage type.

  RateType:
    enum:
      - name: BOUNCE
        value: bounce
      - name: COMPLAINT
        value: complaint
    docs: |
      Type of rate. `bounce` is bounced messages divided by messages sent,
      counting permanent and transient bounces; `complaint` is spam complaints
      divided by messages sent.

  RateTypes:
    type: list<RateType>
    docs: List of rate types to query. Omit to query both.

  RatePeriod:
    type: integer
    docs: |
      How often a point is sampled, as a whole number of seconds between 60
      and 86400. Defaults to 3600 (one point per hour).

  Window:
    type: integer
    docs: |
      How far back each point looks, as a whole number of seconds. Must be a
      whole multiple of `period`, at most 30 days (2592000). Defaults to 86400
      (a rolling 24-hour rate).

  RatePoint:
    properties:
      timestamp:
        type: datetime
        docs: End of the window the point covers; the window is the `window` seconds before it.
      rate:
        type: optional<double>
        docs: |
          Bounced or complained messages divided by messages sent over the
          window, as a fraction (0.05 is 5%). Null when nothing was sent in
          the window.
      sent:
        type: integer
        docs: Messages sent in the window, counted per recipient.

  QueryRatesResponse:
    type: map<RateType, list<RatePoint>>
    docs: Rate series grouped by rate type.

service:
  url: Http
  base-path: /metrics
  auth: true

  endpoints:
    queryEvents:
      method: GET
      path: /events
      display-name: Query Events
      docs: |
        Counts of email events (sent, delivered, bounced, etc.) over time for
        the organization. Defaults to the last 24 hours; `start` must be within
        the last 90 days, and a future `end` is clamped to now. Omit `period`
        for individual event counts, or set it to sum counts into buckets of
        that many seconds.

        **CLI:**
        ```bash
        agentmail metrics query-events
        ```
      request:
        name: QueryEventsRequest
        query-parameters:
          event_types: optional<MetricEventTypes>
          start: optional<Start>
          end: optional<End>
          period: optional<Period>
          limit: optional<MetricLimit>
          descending: optional<Descending>
      response: QueryMetricsResponse
      errors:
        - global.ValidationError

    queryUsage:
      method: GET
      path: /usage
      display-name: Query Usage
      docs: |
        Cumulative usage series for the organization. Each point is the running
        total of the usage type at that timestamp, not the change within the
        bucket. Defaults to the last 24 hours; `start` must be within the last
        90 days, and a future `end` is clamped to now. The range divided by
        `period` must not exceed 1000 buckets.
      request:
        name: QueryUsageRequest
        query-parameters:
          usage_types: optional<UsageTypes>
          start: optional<Start>
          end: optional<End>
          period: optional<Period>
          limit: optional<MetricLimit>
          descending: optional<Descending>
      response: QueryUsageResponse
      errors:
        - global.ValidationError

    queryRates:
      method: GET
      path: /rates
      display-name: Query Rates
      docs: |
        Rolling bounce and complaint rates for the organization. At each
        `period` grid point, the bounced (or complained) messages over the
        preceding `window` divided by the messages sent over the same window,
        with the send count alongside so you can see the volume behind
        it. This is the number AgentMail's account moderation acts on: a
        warning at a 5% bounce rate and suspension at 10%, evaluated over a
        rolling 24 hours once at least 1,000 messages were sent in that
        window. Defaults to the rolling 24-hour rate sampled hourly over the
        last day; `start` must be within the last 90 days, `window` must be a
        whole multiple of `period`, and the range plus window divided by
        `period` must not exceed 1000 buckets.

        **CLI:**
        ```bash
        agentmail metrics query-rates
        ```
      request:
        name: QueryRatesRequest
        query-parameters:
          rate_types: optional<RateTypes>
          start: optional<Start>
          end: optional<End>
          period: optional<RatePeriod>
          window: optional<Window>
          limit: optional<MetricLimit>
          descending: optional<Descending>
      response: QueryRatesResponse
      errors:
        - global.ValidationError
