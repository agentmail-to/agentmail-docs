# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  global: __package__.yml

types:
  CredentialId: string

  CredentialType:
    enum:
      - password
      - totp
      - secret
      - signing_key
      - passkey

  CredentialName: string

  CredentialClientId: string

  CredentialOrigin: string

  CredentialExpiresAt: datetime

  CredentialUser:
    properties:
      id: optional<string>
      name: optional<string>
      display_name: optional<string>

  CredentialRp:
    properties:
      id: string
      name: optional<string>

  TotpAlgorithm:
    enum:
      - SHA1
      - SHA256
      - SHA512

  TotpSettings:
    properties:
      algorithm: optional<TotpAlgorithm>
      digits: optional<integer>
      period: optional<integer>
      issuer: optional<string>

  SigningAlgorithm:
    enum:
      - ECDSA_SHA_256
      - ED25519

  CredentialPublicKey:
    properties:
      algorithm: string
      jwk: map<string, unknown>
      webauthn_id: optional<string>

  CredentialItem:
    properties:
      credential_id: CredentialId
      organization_id: global.OrganizationId
      pod_id: optional<string>
      inbox_id: optional<string>
      client_id: optional<CredentialClientId>
      type: CredentialType
      name: optional<CredentialName>
      origin: optional<CredentialOrigin>
      user: optional<CredentialUser>
      rp: optional<CredentialRp>
      totp: optional<TotpSettings>
      expires_at: optional<CredentialExpiresAt>
      created_at: datetime
      updated_at: datetime

  Credential:
    extends: CredentialItem
    properties:
      public_key: optional<CredentialPublicKey>
      version: integer
      use_count: optional<integer>
      last_used_at: optional<datetime>

  ListCredentialsResponse:
    properties:
      count: global.Count
      limit: optional<global.Limit>
      next_page_token: optional<global.PageToken>
      credentials: list<CredentialItem>

  CreatePasswordCredential:
    properties:
      name: optional<CredentialName>
      client_id: optional<CredentialClientId>
      origin: CredentialOrigin
      user: PasswordUser
      password: optional<string>
      expires_at: optional<CredentialExpiresAt>

  PasswordUser:
    properties:
      name: string
      display_name: optional<string>

  TotpUser:
    properties:
      name: optional<string>
      display_name: optional<string>

  CreateTotpCredential:
    properties:
      name: optional<CredentialName>
      client_id: optional<CredentialClientId>
      origin: CredentialOrigin
      seed: optional<string>
      otpauth_uri: optional<string>
      totp: optional<TotpSettings>
      user: optional<TotpUser>

  CreateSecretCredential:
    properties:
      name: optional<CredentialName>
      client_id: optional<CredentialClientId>
      origin: optional<CredentialOrigin>
      value: string
      expires_at: optional<CredentialExpiresAt>

  CreateSigningKeyCredential:
    properties:
      name: optional<CredentialName>
      client_id: optional<CredentialClientId>
      algorithm: SigningAlgorithm
      private_key: optional<string>
      expires_at: optional<CredentialExpiresAt>

  CreateCredentialRequest:
    discriminant: type
    union:
      password: CreatePasswordCredential
      totp: CreateTotpCredential
      secret: CreateSecretCredential
      signing_key: CreateSigningKeyCredential

  UpdateCredentialUser:
    properties:
      name: optional<nullable<string>>
      display_name: optional<nullable<string>>

  UpdateCredentialRp:
    properties:
      name: optional<nullable<string>>

  UpdateCredentialTotp:
    properties:
      issuer: optional<nullable<string>>

  UpdateCredentialRequest:
    properties:
      name: optional<nullable<CredentialName>>
      user: optional<UpdateCredentialUser>
      rp: optional<UpdateCredentialRp>
      totp: optional<UpdateCredentialTotp>
      expires_at: optional<nullable<CredentialExpiresAt>>

  RotatePasswordCredential:
    properties:
      password: optional<string>
      expires_at: optional<CredentialExpiresAt>

  RotateTotpCredential:
    properties:
      seed: optional<string>
      otpauth_uri: optional<string>
      totp: optional<TotpSettings>

  RotateSecretCredential:
    properties:
      value: string
      expires_at: optional<CredentialExpiresAt>

  RotateSigningKeyCredential:
    properties:
      private_key: optional<string>
      expires_at: optional<CredentialExpiresAt>

  RotateCredentialRequest:
    discriminant: type
    union:
      password: RotatePasswordCredential
      totp: RotateTotpCredential
      secret: RotateSecretCredential
      signing_key: RotateSigningKeyCredential

  RetrieveCredentialRequest:
    properties:
      origin: optional<string>

  RetrievedPassword:
    properties:
      user: CredentialUser
      password: string

  RetrievedTotp:
    properties:
      code: string
      expires_at: datetime

  RetrievedSecret:
    properties:
      value: string

  RetrieveCredentialResponse:
    discriminant: type
    union:
      password: RetrievedPassword
      totp: RetrievedTotp
      secret: RetrievedSecret

  SignCredentialRequest:
    properties:
      data: string

  SignCredentialResponse:
    properties:
      type: literal<"signing_key">
      signature: string
      algorithm: SigningAlgorithm
      version: integer

  PublicKeyCredentialDescriptor:
    extra-properties: true
    properties:
      id: string
      type: optional<string>
      transports: optional<list<string>>

  PublicKeyCredentialRpEntity:
    extra-properties: true
    properties:
      id: optional<string>
      name: optional<string>

  PublicKeyCredentialUserEntity:
    extra-properties: true
    properties:
      id: string
      name: optional<string>
      displayName: optional<string>

  PublicKeyCredentialParameters:
    extra-properties: true
    properties:
      type: string
      alg: integer

  PublicKeyCredentialCreationOptions:
    extra-properties: true
    properties:
      rp: PublicKeyCredentialRpEntity
      user: PublicKeyCredentialUserEntity
      challenge: string
      pubKeyCredParams: optional<list<PublicKeyCredentialParameters>>
      excludeCredentials: optional<list<PublicKeyCredentialDescriptor>>
      extensions: optional<map<string, unknown>>

  PublicKeyCredentialRequestOptions:
    extra-properties: true
    properties:
      challenge: string
      rpId: optional<string>
      allowCredentials: optional<list<PublicKeyCredentialDescriptor>>

  RegisterPasskeyRequest:
    properties:
      name: optional<CredentialName>
      client_id: optional<CredentialClientId>
      origin: string
      options: PublicKeyCredentialCreationOptions

  AuthenticatorAttestationResponse:
    properties:
      clientDataJSON: string
      attestationObject: string
      authenticatorData: string
      publicKey: string
      publicKeyAlgorithm: integer
      transports: list<string>

  RegistrationResponse:
    properties:
      id: string
      rawId: string
      type: literal<"public-key">
      response: AuthenticatorAttestationResponse
      authenticatorAttachment: literal<"platform">
      clientExtensionResults: map<string, unknown>

  RegisterPasskeyResponse:
    properties:
      credential: Credential
      registration: RegistrationResponse

  AssertCredentialRequest:
    properties:
      origin: string
      options: PublicKeyCredentialRequestOptions
      credential_id: optional<CredentialId>

  AuthenticatorAssertionResponse:
    properties:
      clientDataJSON: string
      authenticatorData: string
      signature: string
      userHandle: optional<string>

  AuthenticationResponse:
    properties:
      id: string
      rawId: string
      type: literal<"public-key">
      response: AuthenticatorAssertionResponse
      authenticatorAttachment: literal<"platform">
      clientExtensionResults: map<string, unknown>

  AssertCredentialResponse:
    properties:
      credential_id: CredentialId
      assertion: AuthenticationResponse

errors:
  CredentialForbiddenError:
    status-code: 403
    type: global.ErrorResponse

service:
  url: Http
  base-path: /credentials
  auth: true

  endpoints:
    list:
      method: GET
      path: ""
      display-name: List Credentials
      request:
        name: ListCredentialsRequest
        query-parameters:
          limit: optional<global.Limit>
          page_token: optional<global.PageToken>
          ascending: optional<boolean>
          origin: optional<string>
          rp_id: optional<string>
          site: optional<string>
          name: optional<string>
      response: ListCredentialsResponse
      errors:
        - global.ValidationError
        - CredentialForbiddenError
      examples:
        - query-parameters:
            site: github.com
          response:
            body:
              count: 1
              credentials:
                - credential_id: 0d3a1f5e-7c2b-4e8a-9f61-2b5c8d4e7a10
                  organization_id: org_2abc123
                  pod_id: pod_7k2m9q
                  inbox_id: support-bot@agentmail.to
                  client_id: github-support-bot
                  type: password
                  name: GitHub
                  origin: https://github.com
                  user:
                    name: support-bot@agentmail.to
                  created_at: "2026-11-18T15:04:05.000Z"
                  updated_at: "2026-11-18T15:04:05.000Z"

    get:
      method: GET
      path: /{credential_id}
      display-name: Get Credential
      path-parameters:
        credential_id: CredentialId
      response: Credential
      errors:
        - CredentialForbiddenError
        - global.NotFoundError
      examples:
        - path-parameters:
            credential_id: github-support-bot
          response:
            body:
              credential_id: 0d3a1f5e-7c2b-4e8a-9f61-2b5c8d4e7a10
              organization_id: org_2abc123
              pod_id: pod_7k2m9q
              inbox_id: support-bot@agentmail.to
              client_id: github-support-bot
              type: password
              name: GitHub
              origin: https://github.com
              user:
                name: support-bot@agentmail.to
              version: 1
              use_count: 3
              created_at: "2026-11-18T15:04:05.000Z"
              updated_at: "2026-11-18T15:04:05.000Z"
              last_used_at: "2026-11-19T09:12:44.000Z"

    create:
      method: POST
      path: ""
      display-name: Create Credential
      request: CreateCredentialRequest
      response: Credential
      errors:
        - global.ValidationError
        - CredentialForbiddenError
        - global.NotFoundError
        - global.ConflictError
      examples:
        - request:
            type: password
            name: GitHub
            client_id: github-support-bot
            origin: https://github.com/login
            user:
              name: support-bot@agentmail.to
          response:
            body:
              credential_id: 0d3a1f5e-7c2b-4e8a-9f61-2b5c8d4e7a10
              organization_id: org_2abc123
              client_id: github-support-bot
              type: password
              name: GitHub
              origin: https://github.com
              user:
                name: support-bot@agentmail.to
              version: 1
              use_count: 0
              created_at: "2026-11-18T15:04:05.000Z"
              updated_at: "2026-11-18T15:04:05.000Z"

    register:
      method: POST
      path: /register
      display-name: Register Passkey
      request: RegisterPasskeyRequest
      response: RegisterPasskeyResponse
      errors:
        - global.ValidationError
        - CredentialForbiddenError
        - global.NotFoundError
        - global.ConflictError

    update:
      method: PATCH
      path: /{credential_id}
      display-name: Update Credential
      path-parameters:
        credential_id: CredentialId
      request: UpdateCredentialRequest
      response: Credential
      errors:
        - global.ValidationError
        - CredentialForbiddenError
        - global.NotFoundError
        - global.ConflictError

    rotate:
      method: POST
      path: /{credential_id}/rotate
      display-name: Rotate Credential
      path-parameters:
        credential_id: CredentialId
      request: RotateCredentialRequest
      response: Credential
      errors:
        - global.ValidationError
        - CredentialForbiddenError
        - global.NotFoundError
        - global.ConflictError

    delete:
      method: DELETE
      path: /{credential_id}
      display-name: Delete Credential
      path-parameters:
        credential_id: CredentialId
      errors:
        - CredentialForbiddenError
        - global.NotFoundError

    retrieve:
      method: POST
      path: /{credential_id}/retrieve
      display-name: Retrieve Credential
      path-parameters:
        credential_id: CredentialId
      request: RetrieveCredentialRequest
      response: RetrieveCredentialResponse
      errors:
        - global.ValidationError
        - CredentialForbiddenError
        - global.NotFoundError
        - global.ConflictError
      examples:
        - path-parameters:
            credential_id: github-support-bot
          request:
            origin: https://github.com/login
          response:
            body:
              type: password
              user:
                name: support-bot@agentmail.to
              password: correct-horse-battery-staple

    sign:
      method: POST
      path: /{credential_id}/sign
      display-name: Sign With Credential
      path-parameters:
        credential_id: CredentialId
      request: SignCredentialRequest
      response: SignCredentialResponse
      errors:
        - global.ValidationError
        - CredentialForbiddenError
        - global.NotFoundError
        - global.ConflictError

    assert:
      method: POST
      path: /assert
      display-name: Sign In With Passkey
      request: AssertCredentialRequest
      response: AssertCredentialResponse
      errors:
        - global.ValidationError
        - CredentialForbiddenError
        - global.NotFoundError
        - global.ConflictError
