# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json
api:
  specs:
    - openapi: ../../../openapi/openapi.yml
      overrides: ./openapi-overrides.yml
  auth:
    any: [BearerAuth, TokenAuth]
auth-schemes:
  BearerAuth:
    scheme: bearer
    token: { name: apiKey, env: AGENTMAIL_API_KEY }
  TokenAuth:
    scheme: bearer
    token: { name: token, env: AGENTMAIL_TOKEN }
default-group: cli
groups:
  cli:
    generators:
      - name: fern-cli-generator
        version: 0.17.8
        smart-casing: true
        config:
          binaryName: agentmail
        output:
          location: npm
          package-name: agentmail-cli
          token: OIDC
        github:
          repository: agentmail-to/agentmail-cli-fern
          mode: pull-request
