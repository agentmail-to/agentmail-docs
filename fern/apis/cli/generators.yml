# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json
api:
  specs:
    - openapi: ../../../openapi/openapi.yml
      overrides: ./openapi-overrides.yml
  auth:
    any: [BearerAuth, TokenAuth]
auth-schemes:
  BearerAuth:
    scheme: bearer
    token: { name: apiKey, env: AGENTMAIL_API_KEY }
  TokenAuth:
    scheme: bearer
    token: { name: token, env: AGENTMAIL_TOKEN }
default-group: cli
groups:
  cli:
    generators:
      - name: fern-cli-generator
        version: 0.31.2
        smart-casing: true
        config:
          binaryName: agentmail
          packageIdentity:
            name: agentmail-cli
            description: Command-line interface for the AgentMail API. Send, receive, reply, and manage threaded email conversations from your terminal.
            license: MIT
            repository: https://github.com/agentmail-to/agentmail-cli-fern
            homepage: https://agentmail.to
            authors: ["AgentMail <support@agentmail.cc>"]
            keywords: ["email", "api", "cli", "agent", "agentmail"]
        output:
          location: npm
          package-name: agentmail-cli-fern
          token: OIDC
        github:
          repository: agentmail-to/agentmail-cli-fern
          mode: pull-request
