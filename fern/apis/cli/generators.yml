# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json
api:
  specs:
    - openapi: ../../../openapi/openapi.yml
      overrides: ./openapi-overrides.yml
  # Required. Without this key the `env` override below is silently ignored
  # and the generated CLI reads AGENTMAIL_TOKEN instead (verified on 0.38.10).
  auth: BearerAuth
auth-schemes:
  BearerAuth:
    scheme: bearer
    token: { name: apiKey, env: AGENTMAIL_API_KEY }
default-group: cli
groups:
  cli:
    generators:
      - name: fern-cli-generator
        version: 0.38.10
        smart-casing: true
        config:
          binaryName: agentmail
          packageIdentity:
            name: agentmail-cli
            description: Command-line interface for the AgentMail API. Send, receive, reply, and manage threaded email conversations from your terminal.
            license: MIT
            repository: https://github.com/agentmail-to/agentmail-cli
            homepage: https://agentmail.to
            authors: ["AgentMail <support@agentmail.cc>"]
            keywords: ["email", "api", "cli", "agent", "agentmail"]
        output:
          location: npm
          package-name: agentmail-cli
          token: OIDC
        github:
          repository: agentmail-to/agentmail-cli
          mode: pull-request
