# Overrides merged onto ../../../openapi/openapi.yml for CLI generation.
# The spec's info.title is "api" (from the Fern definition's API name),
# which leaks into the generated README ("# api CLI").
info:
  title: AgentMail
# Rename the Send schema's generated type so it doesn't shadow Rust's
# std::marker::Send trait in the generated CLI crate.
components:
  schemas:
    Send:
      x-fern-type-name: SendEvent

# The Fern definition marks the five send operations idempotent via
# `idempotency-headers` (api.yml), but the fern-openapi export drops that
# declaration, so the generated CLI had no --idempotency-key flag. Those
# operations' override blocks below declare the header explicitly, and mark
# them x-fern-idempotent so retries reuse a single key. That marker was
# unsafe before generator 0.38.6 (retries went out carrying no key at all);
# on 0.38.6 it is verified safe — retries reuse one auto-generated UUID, and
# non-idempotent operations without a key no longer retry at all. NOTE:
# override arrays REPLACE the exported ones, so each such block restates
# the operation's path parameters.

# Nest the flattened inboxes-*/pods-* command groups (e.g. inboxes-messages ->
# 'inboxes messages') by restoring the group structure the OpenAPI export drops.
# Generated from operationId prefixes; method names are the remaining segments.
paths:
  /v0/inboxes/{inbox_id}/api-keys:
    get:
      x-fern-sdk-group-name:
      - inboxes
      - apiKeys
      x-fern-sdk-method-name: list
    post:
      x-fern-sdk-group-name:
      - inboxes
      - apiKeys
      x-fern-sdk-method-name: create
  /v0/inboxes/{inbox_id}/api-keys/{api_key_id}:
    delete:
      x-fern-sdk-group-name:
      - inboxes
      - apiKeys
      x-fern-sdk-method-name: delete
  /v0/inboxes/{inbox_id}/drafts:
