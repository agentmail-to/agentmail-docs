    post:
      x-fern-idempotent: true
      x-fern-sdk-group-name:
      - inboxes
      - drafts
      x-fern-sdk-method-name: send
      parameters:
      - name: inbox_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/inboxesInboxId'
      - name: draft_id
        in: path
        required: true
