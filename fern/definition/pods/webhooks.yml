# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  global: ../__package__.yml
  pods: __package__.yml
  webhooks: ../webhooks/__package__.yml

service:
  url: Http
  base-path: /pods/{pod_id}/webhooks
  path-parameters:
    pod_id: pods.PodId
  auth: true

  endpoints:
    list:
      method: GET
      path: ""
      display-name: List Webhooks
      docs: |
        List webhooks scoped to a specific AgentMail Pod, including pagination controls, delivery configuration, event subscriptions, and webhook identifiers.

        **CLI:**
        ```bash
        agentmail pods:webhooks list --pod-id <pod_id>
        ```
      request:
        name: PodListWebhooksRequest
        query-parameters:
          limit: optional<global.Limit>
          page_token: optional<global.PageToken>
          ascending: optional<global.Ascending>
      response: webhooks.ListWebhooksResponse

    get:
      method: GET
      path: /{webhook_id}
      display-name: Get Webhook
      docs: |
        Get the delivery URL, event subscriptions, inbox filters, timestamps, and configuration for a webhook attached to a specific AgentMail Pod by identifier.

        **CLI:**
        ```bash
        agentmail pods:webhooks get --pod-id <pod_id> --webhook-id <webhook_id>
        ```
      path-parameters:
        webhook_id: webhooks.WebhookId
      response: webhooks.Webhook
      errors:
        - global.NotFoundError

    getHeaders:
      method: GET
      path: /{webhook_id}/headers
      display-name: Get Webhook Headers
      docs: |
        List the names of custom HTTP headers sent with deliveries to a pod-scoped webhook while keeping every sensitive header value strictly write-only by design.
      path-parameters:
        webhook_id: webhooks.WebhookId
      response: webhooks.WebhookHeaderNamesResponse
      errors:
        - global.NotFoundError

    create:
      method: POST
      path: ""
      display-name: Create Webhook
      docs: |
        Create a webhook scoped to one AgentMail Pod, configure its delivery URL, event subscriptions, and inbox filters, and return the resulting configuration.

        **CLI:**
        ```bash
        agentmail pods:webhooks create --pod-id <pod_id> --url https://example.com/webhook --event-type message.received
        ```
      request: webhooks.CreatePodWebhookRequest
      response: webhooks.Webhook
      errors:
        - global.ValidationError

    update:
      method: PATCH
      path: /{webhook_id}
      display-name: Update Webhook
      docs: |
        Update a pod-scoped webhook URL, event subscriptions, or inbox filters while preserving its fixed Pod scope and returning the current configuration details.

        **CLI:**
        ```bash
        agentmail pods:webhooks update --pod-id <pod_id> --webhook-id <webhook_id> --add-inbox-id <inbox_id>
        ```
      path-parameters:
        webhook_id: webhooks.WebhookId
      request: webhooks.UpdatePodWebhookRequest
      response: webhooks.Webhook
      errors:
        - global.NotFoundError
        - global.ValidationError

    updateHeaders:
      method: PATCH
      path: /{webhook_id}/headers
      display-name: Update Webhook Headers
      docs: |
        Set, replace, or remove custom HTTP headers atomically for a pod-scoped webhook while ensuring every sensitive header value remains write-only during updates.
      path-parameters:
        webhook_id: webhooks.WebhookId
      request: webhooks.UpdateWebhookHeadersRequest
      response:
        status-code: 204
      errors:
        - global.NotFoundError
        - global.ValidationError

    delete:
      method: DELETE
      path: /{webhook_id}
      display-name: Delete Webhook
      docs: |
        Permanently delete a webhook scoped to one AgentMail Pod by its identifier and review the required authentication, path parameters, and possible errors.

        **CLI:**
        ```bash
        agentmail pods:webhooks delete --pod-id <pod_id> --webhook-id <webhook_id>
        ```
      path-parameters:
        webhook_id: webhooks.WebhookId
      errors:
        - global.NotFoundError
