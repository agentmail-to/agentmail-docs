# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  inboxes: inboxes/__package__.yml
  threads: threads.yml
  messages: messages.yml
  domains: domains.yml

types:
  EventType:
    enum:
      - name: MESSAGE_RECEIVED
        value: message.received
      - name: MESSAGE_RECEIVED_SPAM
        value: message.received.spam
      - name: MESSAGE_RECEIVED_BLOCKED
        value: message.received.blocked
      - name: MESSAGE_RECEIVED_UNAUTHENTICATED
        value: message.received.unauthenticated
      - name: MESSAGE_SENT
        value: message.sent
      - name: MESSAGE_DELIVERED
        value: message.delivered
      - name: MESSAGE_BOUNCED
        value: message.bounced
      - name: MESSAGE_COMPLAINED
        value: message.complained
      - name: MESSAGE_REJECTED
        value: message.rejected
      - name: DOMAIN_VERIFIED
        value: domain.verified

  EventTypes:
    type: list<EventType>
    docs: Event types for which to send events.

  MessageReceivedEventType:
    enum:
      - name: MESSAGE_RECEIVED
        value: message.received
      - name: MESSAGE_RECEIVED_SPAM
        value: message.received.spam
      - name: MESSAGE_RECEIVED_BLOCKED
        value: message.received.blocked
      - name: MESSAGE_RECEIVED_UNAUTHENTICATED
        value: message.received.unauthenticated

  PodIds:
    type: list<string>
    docs: Pods for which to send events. Maximum 10 per webhook.

  InboxIds:
    type: list<string>
    docs: Inboxes for which to send events. Maximum 10 per webhook.

  EventId:
    type: string
    docs: ID of event.

  Timestamp:
    type: datetime
    docs: Timestamp of event.

  Recipient:
    properties:
      address:
        type: string
        docs: Recipient address.
      status:
        type: string
        docs: Recipient status.

  Send:
    properties:
      inbox_id: inboxes.InboxId
      thread_id: threads.ThreadId
      message_id: messages.MessageId
      timestamp: Timestamp
      recipients:
        type: list<string>
        docs: Sent recipients.

  Delivery:
    properties:
      inbox_id: inboxes.InboxId
      thread_id: threads.ThreadId
      message_id: messages.MessageId
      timestamp: Timestamp
      recipients:
        type: list<string>
        docs: Delivered recipients.

  Bounce:
    properties:
      inbox_id: inboxes.InboxId
      thread_id: threads.ThreadId
      message_id: messages.MessageId
      timestamp: Timestamp
      type:
        type: string
        docs: Bounce type.
      sub_type:
        type: string
        docs: Bounce sub-type.
      recipients:
        type: list<Recipient>
        docs: Bounced recipients.

  Complaint:
    properties:
      inbox_id: inboxes.InboxId
      thread_id: threads.ThreadId
      message_id: messages.MessageId
      timestamp: Timestamp
      type:
        type: string
        docs: Complaint type.
      sub_type:
        type: string
        docs: Complaint sub-type.
      recipients:
        type: list<string>
        docs: Complained recipients.

  Reject:
    properties:
      inbox_id: inboxes.InboxId
      thread_id: threads.ThreadId
      message_id: messages.MessageId
      timestamp: Timestamp
      reason:
        type: string
        docs: Reject reason.

  MetadataMessage:
    docs: Content-free message metadata emitted for customer-hosted data planes. Fetch the resource through the API to read its content.
    properties:
      message_id: messages.MessageId
      thread_id: optional<threads.ThreadId>
      inbox_id: optional<inboxes.InboxId>
      pod_id: optional<string>
      organization_id: optional<string>
      labels: optional<list<string>>
      send_status: optional<string>
      size: optional<integer>
      attachment_count: optional<integer>
      timestamp: optional<Timestamp>
      created_at: optional<Timestamp>
      updated_at: optional<Timestamp>

  MetadataThread:
    docs: Content-free thread metadata emitted for customer-hosted data planes.
    properties:
      thread_id: threads.ThreadId
      inbox_id: optional<inboxes.InboxId>
      pod_id: optional<string>
      organization_id: optional<string>
      labels: optional<list<string>>
      message_count: optional<integer>
      attachment_count: optional<integer>
      timestamp: optional<Timestamp>
      created_at: optional<Timestamp>
      updated_at: optional<Timestamp>

  MetadataEvent:
    docs: A content-free event emitted for a customer-hosted data plane. The event contains identifiers and state metadata only; fetch the referenced resource through the API for content.
    properties:
      type: literal<"event">
      payload_format: literal<"metadata">
      event_type: EventType
      event_id: EventId
      message: optional<MetadataMessage>
      thread: optional<MetadataThread>

  MessageReceivedRealtimeEvent:
    discriminated: false
    union:
      - MessageReceivedEvent
      - MetadataEvent

  MessageSentRealtimeEvent:
    discriminated: false
    union:
      - MessageSentEvent
      - MetadataEvent

  MessageDeliveredRealtimeEvent:
    discriminated: false
    union:
      - MessageDeliveredEvent
      - MetadataEvent

  MessageBouncedRealtimeEvent:
    discriminated: false
    union:
      - MessageBouncedEvent
      - MetadataEvent

  MessageComplainedRealtimeEvent:
    discriminated: false
    union:
      - MessageComplainedEvent
      - MetadataEvent

  MessageRejectedRealtimeEvent:
    discriminated: false
    union:
      - MessageRejectedEvent
      - MetadataEvent

  MessageReceivedEvent:
    docs: A message was received. Spam, blocked, and unauthenticated received-message events use the same payload shape with different `event_type` values.
    properties:
      type: literal<"event">
      event_type: MessageReceivedEventType
      event_id: EventId
      message: messages.Message
      thread: threads.ThreadItem

  MessageSentEvent:
    properties:
      type: literal<"event">
      event_type: literal<"message.sent">
      event_id: EventId
      send: Send

  MessageDeliveredEvent:
    properties:
      type: literal<"event">
      event_type: literal<"message.delivered">
      event_id: EventId
      delivery: Delivery

  MessageBouncedEvent:
    properties:
      type: literal<"event">
      event_type: literal<"message.bounced">
      event_id: EventId
      bounce: Bounce

  MessageComplainedEvent:
    properties:
      type: literal<"event">
      event_type: literal<"message.complained">
      event_id: EventId
      complaint: Complaint

  MessageRejectedEvent:
    properties:
      type: literal<"event">
      event_type: literal<"message.rejected">
      event_id: EventId
      reject: Reject

  DomainVerifiedEvent:
    properties:
      type: literal<"event">
      event_type: literal<"domain.verified">
      event_id: EventId
      domain: domains.Domain
