name: Fern Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fern-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check generated MCP tool catalog
        run: python3 scripts/generate_mcp_tool_catalog.py --check

      - name: Check API key permission lists
        run: python3 scripts/check_permissions.py --check

      - name: Install Fern (version pinned in fern/fern.config.json)
        run: npm install -g "fern-api@$(jq -r .version fern/fern.config.json)"

      - name: Check API is valid
        run: fern check
